<!doctype html><html lang="ar" dir="rtl" class="aqari-auth-unlocked"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار واجهة العقارات — بيانات اصطناعية</title><link rel="stylesheet" href="/src/v267/styles/workspace.css"><link rel="stylesheet" href="/src/v267/styles/property-experience.css"><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7f5;margin:0;padding:20px;color:#20342d}main{max-width:1100px;margin:auto}button,input,select{font:inherit}#modal{display:none;background:#fff;border:1px solid #ccd5cd;border-radius:16px;padding:20px;margin-block:20px}#modal.on{display:block}#modal>button{min-height:48px;padding:10px 20px;margin:12px 6px;border-radius:8px}#fixture-summary{margin-block:20px;border-radius:12px;overflow:hidden}.fixture-note{font-size:14px}.fixture-controls{display:flex;gap:10px;flex-wrap:wrap}*{box-sizing:border-box}</style></head><body><main><p class="fixture-note">اختبار واجهة ببيانات اصطناعية فقط — لا يتصل بقاعدة البيانات ولا يسجل عقاراً حقيقياً.</p><div class="fixture-controls"><button id="fixture-phone">عرض الجوال</button><button id="fixture-tablet">عرض الآيباد</button><button id="fixture-desktop">عرض الكمبيوتر</button><button id="fixture-reload">إعادة قراءة السجل المحفوظ</button><button id="fixture-deny">سحب الصلاحية</button><button id="fixture-edit">تعديل عقار الاختبار</button></div><section id="home"><section id="v205SimpleHome"><header><h1>عقاري</h1></header></section></section><section id="fixture-summary"></section><section id="modal"><h2 id="mt"></h2><div id="fields"></div><button id="saveBtn">حفظ</button><button id="fixture-close">إغلاق</button></section><p id="fixture-status" role="status"></p></main><script>
let db={properties:[['عقار تجربة ٤٠١','مالك اصطناعي','12','4200 د.ك',{aqariPropertyPresentation:1,location:'السالمية، قطعة ٤',price:'350',purpose:'rent',phone:'',photos:[]}],['برج أُلفة','مالك آخر','8','2000 د.ك']],audit:[]};
const mods={properties:['عقار',['العقار','المالك','الوحدات','الإيراد']]};let cloud=structuredClone(db),revision=1,allowed=true;
const binding={userId:'fixture',workspaceId:'fixture'};window.AQARI_DATA_GATE={scope:binding};window.AQARI_EARLY_STORAGE_GATE={scope:binding};
window.AQARI_SUPABASE={context:{user:{id:'fixture'},workspace:{id:'fixture'},membership:{user_id:'fixture',workspace_id:'fixture',is_active:true,role:'general_manager'}},loadAppState:async()=>({payload:structuredClone(cloud),revision}),saveAppState:async(payload,version)=>{if(!allowed||version!==revision)throw Error('FIXTURE_CONFLICT');cloud=structuredClone(payload);revision++;}};
function persist(){}function render(){}
window.AQARI_V202={propertyRecords:()=>allowed?structuredClone(db.properties):[],openProperty:name=>{const row=db.properties.find(r=>r[0]===name);if(row&&allowed)document.querySelector('#fixture-summary').innerHTML=window.AQARI_PROPERTY_EXPERIENCE.summaryMarkup(row);}};
</script><script src="/v267-rental-records.js"></script><script type="module">
import {installPropertyExperience} from '/src/v267/components/property-experience.js';

for(const [id,width]of [['phone','390px'],['tablet','820px'],['desktop','1100px']])document.querySelector('#fixture-'+id).onclick=()=>{document.querySelector('main').style.maxWidth=width;status.textContent='عرض اختباري '+width;};
status.textContent='واجهة الاختبار جاهزة.';
</script></body></html>
