<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص استجابة العقارات — بيانات اصطناعية</title><style>body{font:16px Tahoma,Arial,sans-serif;margin:16px;background:#e9ede9}nav{display:flex;gap:12px;margin-bottom:12px}button{font:inherit;min-height:48px;padding:8px 18px}iframe{display:block;max-width:100%;height:1000px;border:1px solid #a9b9ac;margin:auto;background:white}</style></head><body><p>فحص واجهة ببيانات اصطناعية داخل إطار مستقل؛ لا يُحمّل التطبيق أو حساباً حقيقياً.</p><nav><button data-width="390">هاتف — ٣٩٠</button><button data-width="820">آيباد — ٨٢٠</button><button data-width="1100">كمبيوتر — ١١٠٠</button></nav><iframe title="معاينة استجابة واجهة العقارات" style="width:390px"></iframe><p id="status" role="status">جارٍ تحميل نموذج الاختبار…</p><script type="module">
