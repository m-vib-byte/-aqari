<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AQARI V267 — إعادة تحقق B</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light}body{margin:0;background:#f7f5ef;color:#171717}main{max-width:560px;margin:0 auto;padding:28px 16px}.card{background:#fff;border:1px solid #e5dfcf;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.05)}h1{font-size:1.3rem;margin:.2rem 0 .7rem}p{line-height:1.7}label{display:block;margin:16px 0 6px}input{width:100%;box-sizing:border-box;font:inherit;font-size:1.25rem;padding:12px;border:1px solid #cfc8b8;border-radius:12px;text-align:center;letter-spacing:.22em}button{width:100%;margin-top:12px;font:inherit;border:0;border-radius:12px;padding:13px;background:#171717;color:#fff;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:14px;padding:12px;border-radius:12px;background:#f3f1e9;white-space:pre-wrap}.bad{color:#9f1e1e}.ok{color:#116b36}</style>
<script src="/public-config.js"></script>
<script src="/vendor/supabase-js-2.114.0.js"></script>
</head>
<body>
<main><section class="card">
<h1>إعادة التحقق قبل اختبار B</h1>
<p>أدخل الرمز الحالي من تطبيق المصادقة. بعد نجاحه سيتم فتح اختبار B تلقائيًا.</p>
<form id="form">
<label for="code">رمز التحقق المكوّن من 6 أرقام</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus>
<button id="submit" type="submit">تحقق وابدأ اختبار B</button>
</form>
<div id="status" class="status" role="status" aria-live="polite">جاهز لإعادة التحقق.</div>
</section></main>
<script>
(()=>{
'use strict';
const EXPECTED_URL='https://ofgmcsmxmdswlovsckqs.supabase.co';
const BRANCH_HOST='aqari-git-support-v267-knet-range-reconcile-20260915-m-vib-5421.vercel.app';
const cfg=window.AQARI_PUBLIC_CONFIG||{};
const form=document.getElementById('form'),code=document.getElementById('code'),submit=document.getElementById('submit'),status=document.getElementById('status');
function setStatus(text,kind=''){status.textContent=text;status.className='status '+kind}
function fail(message){throw new Error(message)}
function normalizeOtp(value){
 const arabic='٠١٢٣٤٥٦٧٨٩',persian='۰۱۲۳۴۵۶۷۸۹';
 return String(value??'').trim()
  .replace(/[٠-٩]/g,ch=>String(arabic.indexOf(ch)))
  .replace(/[۰-۹]/g,ch=>String(persian.indexOf(ch)))
  .replace(/[\s\u00a0\u200e\u200f-]/g,'');
}
async function main(event){
 event.preventDefault();
 const normalized=normalizeOtp(code.value);
 if(!/^\d{6}$/.test(normalized)){setStatus('أدخل رمزًا صحيحًا من 6 أرقام.','bad');return;}
 submit.disabled=true;code.disabled=true;setStatus('جاري إعادة التحقق…');
 try{
  if(location.hostname!==BRANCH_HOST||cfg.releaseStage!=='preview'||cfg.supabaseUrl!==EXPECTED_URL)fail('PREVIEW_REQUIRED');
  if(!window.supabase?.createClient)fail('SUPABASE_LIBRARY_MISSING');
  const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:cfg.supabaseAuthStorageKey}});
  const {data:sessionData,error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;
  if(!sessionData?.session?.user?.id)fail('AUTH_SESSION_REQUIRED');
  const {data:factors,error:factorsError}=await client.auth.mfa.listFactors();if(factorsError)throw factorsError;
  const all=[...(factors?.totp||[]),...(factors?.phone||[])];
  const verified=all.filter(item=>item.status==='verified');
  const unverified=all.filter(item=>item.status==='unverified');
  if(!verified.length&&unverified.length)fail('MFA_ENROLLMENT_INCOMPLETE');
  if(!verified.length)fail('MFA_FACTOR_REQUIRED');
  const factor=verified[0];
  const {error:verifyError}=await client.auth.mfa.challengeAndVerify({factorId:factor.id,code:normalized});if(verifyError)throw verifyError;
  const {data:aal,error:aalError}=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(aalError)throw aalError;
  if(aal?.currentLevel!=='aal2')fail('MFA_AAL2_REQUIRED');
  setStatus('تم التحقق. فتح اختبار B الآن…','ok');
  location.replace('/qa-b.html?run=1');
 }catch(error){
  const raw=String(error?.message||'MFA_REAUTH_FAILED');
  const text=raw.includes('MFA_ENROLLMENT_INCOMPLETE')
   ?'عامل المصادقة الحالي غير مكتمل الربط. لا تكرر إدخال الرمز الآن؛ أكمل ربط تطبيق المصادقة من صفحة الأمان أولًا، ثم ارجع إلى هذا الاختبار.'
   :raw.includes('MFA_FACTOR_REQUIRED')
    ?'لا يوجد عامل مصادقة موثق لهذا الحساب. أكمل إضافة تطبيق المصادقة من صفحة الأمان أولًا.'
    :/Invalid TOTP|Token has expired|invalid.*code|otp/i.test(raw)
     ?'الرمز لا يطابق عامل المصادقة الموثق أو انتهت صلاحيته. استخدم الرمز الحالي فقط، وتأكد أن ضبط الوقت في الجهاز تلقائي.'
     :'تعذر إعادة التحقق. حدّث الصفحة وتأكد أنك مسجل الدخول ثم حاول مرة أخرى.';
  setStatus(text,'bad');
  submit.disabled=false;code.disabled=false;code.value='';code.focus();
 }
}
form.addEventListener('submit',main);
})();
</script>
</body>
</html>
