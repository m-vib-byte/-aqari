name: Patch V267 tenant history proof

on:
  push:
    branches:
      - fix/v267-preserve-tenant-history
    paths:
      - .github/workflows/patch-v267-history-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-preserve-tenant-history
      - name: Add explicit post-vacating history assertions
        shell: python
        run: |
          import hashlib, json, pathlib
          path = pathlib.Path('staging-database/tests/vacating_release.sql')
          text = path.read_text(encoding='utf-8')
          anchor = "reset role;\n\n-- Direct fixture rows exercise the schema occupancy constraint as the owner/test harness."
          if text.count(anchor) != 1:
              raise SystemExit('VACATING_HISTORY_ASSERTION_ANCHOR_CHANGED')
          proof = """reset role;\n\n-- Releasing the unit must never erase the tenant's historical file, contract, payment or handover evidence.\ndo $$\ndeclare w uuid:=current_setting('release.test.workspace')::uuid;doc_id uuid:=current_setting('release.test.document_id')::uuid;\nbegin\n if not exists(select 1 from public.aqari_tenants where workspace_id=w and id='f267f200-0000-4000-8000-000000000001') then raise exception 'VACATED_TENANT_HISTORY_DELETED';end if;\n if not exists(select 1 from public.aqari_leases where workspace_id=w and id='f267f400-0000-4000-8000-000000000001' and status='expired' and vacated_on='2026-01-31') then raise exception 'VACATED_LEASE_HISTORY_DELETED';end if;\n if not exists(select 1 from public.aqari_rent_payments where workspace_id=w and id='f267f500-0000-4000-8000-000000000001' and amount=100 and status='paid') then raise exception 'VACATED_PAYMENT_HISTORY_DELETED';end if;\n if not exists(select 1 from public.aqari_documents where workspace_id=w and id=doc_id and status='uploaded' and entity_type='lease' and entity_ref='release-lease-a') then raise exception 'VACATED_HANDOVER_HISTORY_DELETED';end if;\nend $$;\n\n-- Direct fixture rows exercise the schema occupancy constraint as the owner/test harness."""
          path.write_text(text.replace(anchor, proof), encoding='utf-8')

          inventory_path = pathlib.Path('FILE_INVENTORY.json')
          data = json.loads(inventory_path.read_text(encoding='utf-8'))
          target = str(path)
          entries = {entry['path']: entry for entry in data['files']}
          entry = entries[target]
          payload = path.read_bytes()
          entry['size'] = len(payload)
          entry['sha256'] = hashlib.sha256(payload).hexdigest()
          inventory_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(target, entry['size'], entry['sha256'])
      - name: Commit history proof and exact inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging-database/tests/vacating_release.sql FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'test(v267): prove vacated tenant history is retained'
          git push origin HEAD:fix/v267-preserve-tenant-history
