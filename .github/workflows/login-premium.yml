name: Premium login interface
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Validate premium UI and unchanged auth
        run: node tests/login-premium.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-premium-screenshots
          path: test-results/login-premium
          retention-days: 7
