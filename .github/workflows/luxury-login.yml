name: Luxury login experience
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-login-luxury.cjs
      - run: node --check login-luxury.js
      - run: node --test tests/luxury-login.test.cjs tests/login-navigation.test.cjs
      - run: node tests/mobile-login-shell.test.cjs
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/luxury-login.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luxury-login-results
          path: test-results/luxury-login
          retention-days: 3
