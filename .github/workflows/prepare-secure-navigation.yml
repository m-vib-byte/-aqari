name: Prepare secure navigation correction
on:
  push:
    branches: [fix/v266-ui-after-login]
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare secure navigation correction'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded secure navigation correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('secure-auth-bridge.js');data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='6c68c1db425d221fc09ae4b0afadeb62fb8919e7'
          source=p.read_text()
          marker='  function installOverrides(){'
          helper='''  // The obsolete V121 label-based list omits core routes, even for managers.
            // Use the existing secure route policy only for the exact activated
            // bridge identity. Local session labels never grant navigation access.
            function canUseAuthenticatedRoute(route){
              try{
                const expected=accessIdentity(context);
                const live=accessIdentity(window.AQARI_SUPABASE?.context);
                if(!sameIdentity(expected,live))return false;
                const data=window.AQARI_DATA_GATE?.scope;
                const storage=window.AQARI_EARLY_STORAGE_GATE?.scope;
                if(data?.userId!==expected.userId||data?.workspaceId!==expected.workspaceId||
                   storage?.userId!==expected.userId||storage?.workspaceId!==expected.workspaceId)return false;
                return typeof window.canNavigateV206==='function'&&window.canNavigateV206(route)===true;
              }catch(_){return false;}
            }
          
          '''
          assert source.count(marker)==1
          source=source.replace(marker,helper+marker+'\n    window.canAccessV121 = canUseAuthenticatedRoute;')
          p.write_text(source)
          p=Path('tests/secure-navigation.test.cjs');s=p.read_text()
          assert ",viewer:['home']" in s
          p.write_text(s.replace(",viewer:['home']",''))
          p=Path('tests/startup-ui-loading.test.cjs');s=p.read_text()
          p.write_text(s+"\nrequire('./secure-navigation.test.cjs');\n")
          p=Path('FILE_INVENTORY.json');inventory=json.loads(p.read_text());entries={x['path']:x for x in inventory['files']}
          for name in ['secure-auth-bridge.js','tests/startup-ui-loading.test.cjs','tests/secure-navigation.test.cjs']:
              data=Path(name).read_bytes();entry={'path':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              if name in entries:entries[name].update(entry)
              else:inventory['files'].append(entry)
          p.write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Require navigation and existing auth boundaries
        run: |
          node --check secure-auth-bridge.js
          node --test tests/startup-ui-loading.test.cjs tests/auth-data-gate.test.cjs tests/v266-login-bootstrap.test.cjs tests/login-navigation.test.cjs tests/v266-startup-snapshot.test.cjs
          node scripts/release-freeze-selftest.mjs
      - name: Commit application and test files only
        run: |
          git config user.name 'm-vib-byte'
          git config user.email 'm-vib@hotmail.com'
          git add secure-auth-bridge.js tests/secure-navigation.test.cjs tests/startup-ui-loading.test.cjs FILE_INVENTORY.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'fix: use verified workspace route policy instead of stale local role lists'
          git push origin HEAD:fix/v266-ui-after-login
