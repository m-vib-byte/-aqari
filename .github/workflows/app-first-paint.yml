name: App first paint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/app-first-paint.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-first-paint-results
          path: test-results/app-first-paint
          retention-days: 2
