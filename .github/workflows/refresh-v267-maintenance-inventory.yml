name: Refresh V267 maintenance source inventory

on:
  push:
    branches:
      - fix/v267-maintenance-request-attachments
    paths:
      - .github/workflows/refresh-v267-maintenance-inventory.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-maintenance-request-attachments
      - name: Recompute exact source inventory for maintenance follow-up
        shell: python
        run: |
          import hashlib,json,pathlib
          targets=[
            'tenant.html','v267-tenant-portal.js','v267-service-desk.js',
            'src/v267/components/maintenance-request.js',
            'tests/v267-maintenance-request.test.mjs','tests/v267-service-desk.test.cjs','tests/v267-tenant-portal.test.cjs',
            'staging-database/sql/maintenance-request-details.sql','staging-database/tests/maintenance_request_details.sql',
            'staging-database/local-test/package.json'
          ]
          p=pathlib.Path('FILE_INVENTORY.json');data=json.loads(p.read_text(encoding='utf-8'));entries={e['path']:e for e in data['files']}
          for target in targets:
              payload=pathlib.Path(target).read_bytes();entry=entries.get(target)
              if entry is None:
                  entry={'path':target};data['files'].append(entry);entries[target]=entry
              entry['size']=len(payload);entry['sha256']=hashlib.sha256(payload).hexdigest()
              print(target,entry['size'],entry['sha256'])
          data['files'].sort(key=lambda e:e['path'])
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Verify inventory before commit
        run: node scripts/verify-staging-runtime.mjs
      - name: Commit inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'chore(v267): refresh maintenance follow-up source inventory'
          git push origin HEAD:fix/v267-maintenance-request-attachments
