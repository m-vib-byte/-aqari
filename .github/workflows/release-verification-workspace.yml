name: Release verification workspace
on:
  push:
    branches: [fix/v267-release-verification]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    timeout-minutes: 10
    env:
      AQARI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AQARI_EXPECTED_SHA }}
          persist-credentials: false
      - name: Trust checked-out workspace in job container
        # Checkout's temporary Git config does not persist into container run steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify exact release source identity
        run: node scripts/verify-release-source.mjs /tmp/aqari-verification/source-provenance.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Complete JavaScript regression suite
        run: |
          mkdir -p /tmp/aqari-verification
          node scripts/test-release-regressions.mjs | tee /tmp/aqari-verification/node-tests.log
      - name: Install locked isolated SQL runtime
        run: npm ci --prefix staging-database/local-test --ignore-scripts --no-audit --no-fund
      - name: Salary voucher numbering and immutable history
        run: node staging-database/local-test/run-salary-numeric-vouchers.mjs | tee /tmp/aqari-verification/sql-salary-numbers.log
      - name: Reversible property archive, preserved links and new activity guard
        env:
          AQARI_SCHEMA_CATALOG: ${{ github.workspace }}/staging-database/local-test/schema-catalog-production-2026-10-05.json
        run: node staging-database/local-test/run-isolated.mjs staging-database/sql/property-lifecycle.sql staging-database/sql/property-lifecycle.sql staging-database/tests/property_lifecycle.sql | tee /tmp/aqari-verification/sql-property-lifecycle.log
      - name: Corrected salary numbering and version linkage
        run: node staging-database/local-test/run-salary-numeric-corrections.mjs | tee /tmp/aqari-verification/sql-salary-corrections.log
      - name: Immutable issued payroll allocation and employee transfer history
        run: node staging-database/local-test/run-hr-payroll-snapshot.mjs | tee /tmp/aqari-verification/sql-hr-snapshot.log
      - name: Salary expense linkage, reference deduplication and financial period scope
        run: node staging-database/local-test/run-hr-expense-bridge.mjs | tee /tmp/aqari-verification/sql-hr-expense.log
      - name: Exact-fils payroll cost allocation and report consistency
        run: node staging-database/local-test/run-hr-cost-allocation.mjs | tee /tmp/aqari-verification/sql-hr-allocation.log
      - name: Saved report filters persistence and RLS isolation
        run: node staging-database/local-test/run-isolated.mjs staging-database/sql/saved-report-filters.sql staging-database/sql/saved-report-filters.sql staging-database/tests/saved_report_filters.sql | tee /tmp/aqari-verification/sql-report-filters.log
      - name: Existing SQL acceptance suites
        run: npm run test:completion --prefix staging-database/local-test | tee /tmp/aqari-verification/sql-existing.log
      - name: Contract archive and official issue/archive isolated SQL suites
        run: npm run test:completion:contracts --prefix staging-database/local-test | tee /tmp/aqari-verification/sql-contracts.log
      - name: Reproduce cancelled-receipt close bug then verify repair
        run: node scripts/verify-financial-close-regression.mjs | tee /tmp/aqari-verification/sql-close-regression.log
      - name: Commercial allocation reconciliation candidate (local only)
        run: |
          python3 scripts/build-commercial-allocation-reconciliation.py
          git diff --exit-code -- staging-database/reconciliation/commercial-allocation
          node scripts/verify-commercial-allocation-reconciliation.mjs | tee /tmp/aqari-verification/sql-commercial-reconciliation.log
      - name: Commercial reconciliation against captured Production application DDL
        run: node scripts/verify-commercial-production-catalog.mjs | tee /tmp/aqari-verification/sql-commercial-production-catalog.log
      - name: Production commercial sales basis (local only)
        run: node scripts/verify-production-commercial-sales-basis.mjs | tee /tmp/aqari-verification/sql-commercial-sales-basis.log
      - name: Production tenant rating and contact reconciliation (local only)
        run: |
          python3 scripts/test-tenant-candidate-reproducibility.py
          git diff --exit-code -- staging-database/reconciliation/tenant-rating staging-database/reconciliation/tenant-contact
          node scripts/verify-production-tenant-reconciliation.mjs | tee /tmp/aqari-verification/sql-tenant-reconciliation.log
      - name: Production maintenance reconciliation (local only)
        run: |
          python3 scripts/build-production-maintenance-reconciliation.py
          git diff --exit-code -- staging-database/reconciliation/maintenance
          node scripts/verify-production-maintenance-reconciliation.mjs | tee /tmp/aqari-verification/sql-maintenance-reconciliation.log
      - name: Sales basis persistence, history and combined reconciliation (local only)
        run: |
          python3 scripts/build-production-sales-basis-reconciliation.py
          git diff --exit-code -- staging-database/reconciliation/commercial-sales-basis
          node scripts/verify-production-sales-basis-reconciliation.mjs | tee /tmp/aqari-verification/sql-sales-basis-reconciliation.log
      - name: Document handover persistence and access boundaries
        run: |
          node staging-database/local-test/run-isolated.mjs \
            staging-database/sql/mfa-enforcement.sql \
            staging-database/sql/staff-property-scope.sql \
            staging-database/supabase/migrations/20260909225520_v267_document_catalog.sql \
            staging-database/sql/document-categories.sql \
            staging-database/sql/document-handovers.sql \
            staging-database/sql/document-handovers.sql \
            staging-database/tests/document_handovers.sql | tee /tmp/aqari-verification/sql-document-handovers.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated hosted acceptance copies
        run: |
          python staging-database/hosted-test/generate-completion.py --check
          python staging-database/hosted-test/test-generate-completion.py
          python staging-database/hosted-test/current-fixtures.py --check
      - name: PDF and provider rejection tests
        run: |
          python -m pip install -r requirements.txt pypdf==6.10.0
          python -m unittest discover -s tests -p '*_test.py' -v 2>&1 | tee /tmp/aqari-verification/python-tests.log
      - name: Install browser test runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the Playwright container tag to match package-lock.json')"
      - name: Native dialog and session-boundary browser checks
        env:
          AQARI_BROWSER_EVIDENCE: /tmp/aqari-verification/browser
        run: node tests/v267-dialog-progress.browser.mjs | tee /tmp/aqari-verification/browser-tests.log
      - name: Export tracked source and local SQL runtime
        run: |
          node scripts/verify-release-source.mjs /tmp/aqari-verification/source-provenance.json
          git archive --format=tar.gz --output=/tmp/aqari-verification/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/aqari-verification/source-sha.txt
          tar -czf /tmp/aqari-verification/pglite-runtime.tar.gz -C staging-database/local-test/node_modules @electric-sql/pglite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqari-release-verification
          path: /tmp/aqari-verification/
          retention-days: 3
          if-no-files-found: error
  inventory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v267-release-verification'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v267-release-verification
      - name: Reconcile verified file checksums without changing application code
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'POLICY'
          import fs from 'node:fs';
          const path='docs/V267-REQUIREMENTS-155.md';const text=fs.readFileSync(path,'utf8');
          const current="النطاق الملزم وفق أحدث توجيه صريح للمالك في 12 سبتمبر 2026: استكمال البنود الـ155، واختبار الاستخدام الحقيقي والصلاحيات على الآيفون والآيباد والكمبيوتر، والنسخ الاحتياطي الكامل لقاعدة البيانات والحسابات والمرفقات، والاستعادة المعزولة ونقطة رجوع V266 قبل النشر على `myaqari.com`. التفويض قائم ولا يحتاج تجديدًا. يلغي هذا التوجيه استثناء النشر التدريجي السابق؛ لا يكفي نجاح CI أو اكتمال بناء المعاينة. مرجع الشروط [بوابة القبول الكامل](V267-FULL-RELEASE-GATE-2026-09-12.md)، مع الاحتفاظ بأدلة [ربط النماذج الرسمية](V267-OFFICIAL-SOURCES-2026-09-12.md).";
          if(!text.includes(current)){
           const lines=text.split('\n'),indexes=lines.map((line,i)=>line.startsWith('النطاق الجاري وفق آخر')?i:-1).filter(i=>i>=0);
           if(indexes.length!==1)throw Error('RELEASE_POLICY_SOURCE_CHANGED');
           lines[indexes[0]]=current;fs.writeFileSync(path,lines.join('\n'));
          }
          const historical='docs/V267-INCREMENTAL-RELEASE-2026-09-12.md',notice="> **تاريخي — متجاوز بأحدث توجيه للمالك:** استثناء النشر قبل اكتمال البنود الـ155 لم يعد ساريًا. المرجع الملزم [بوابة القبول الكامل](V267-FULL-RELEASE-GATE-2026-09-12.md). تبقى الأدلة أدناه ضمن نطاقها التاريخي ولا تثبت جاهزية الإنتاج.";
          const old=fs.readFileSync(historical,'utf8');if(!old.startsWith(notice))fs.writeFileSync(historical,notice+'\n\n'+old);
          POLICY
          node scripts/audit-v267-evidence.mjs --write
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const p='FILE_INVENTORY.json',v=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const path of ['scripts/verify-release-source.mjs','tests/v267-release-source-identity.test.mjs','src/v267/components/dialog.js','tests/v267-dialog-progress.test.mjs','tests/v267-dialog-progress.browser.mjs','staging-database/sql/financial-close-cancellations.sql','staging-database/tests/financial_close_cancellations.sql','scripts/verify-financial-close-regression.mjs','.github/workflows/release-verification-workspace.yml','docs/V267-EVIDENCE-155.json','staging-database/local-test/package.json','staging-database/local-test/fixtures/financial-close-cancellations-v1.sql','tests/v267-financial-close-gate.test.mjs','scripts/audit-v267-evidence.mjs','docs/V267-REQUIREMENTS-155.md','docs/V267-INCREMENTAL-RELEASE-2026-09-12.md','docs/V267-FULL-RELEASE-GATE-2026-09-12.md']){
           const bytes=fs.readFileSync(path),row={path,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};const i=v.files.findIndex(x=>x.path===path);if(i<0)v.files.push(row);else v.files[i]=row;
          }
          fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          NODE
          node scripts/release-freeze-selftest.mjs
          node scripts/verify-staging-runtime.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_INVENTORY.json docs/V267-EVIDENCE-155.json docs/V267-REQUIREMENTS-155.md docs/V267-INCREMENTAL-RELEASE-2026-09-12.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified cancellation repair and restore full 155-item release policy'
            git push origin HEAD:fix/v267-release-verification
          fi

