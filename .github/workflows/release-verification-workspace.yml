name: Release verification workspace
on:
  push:
    branches: [fix/v267-release-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source only for isolated verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aqari-verification
          git archive --format=tar.gz --output=/tmp/aqari-verification/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/aqari-verification/source-sha.txt
          sha256sum /tmp/aqari-verification/source.tar.gz
      - name: Check configured access without printing credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e 'const fs=require("node:fs");const r={vercelApiTokenConfigured:Boolean(process.env.VERCEL_TOKEN),previewCredentialConfigured:Boolean(process.env.VERCEL_AUTOMATION_BYPASS_SECRET)};fs.writeFileSync("/tmp/aqari-verification/access-presence.json",JSON.stringify(r));console.log(JSON.stringify(r));'
      - uses: actions/upload-artifact@v4
        with:
          name: aqari-verification-source
          path: /tmp/aqari-verification/
          retention-days: 1
          if-no-files-found: error
