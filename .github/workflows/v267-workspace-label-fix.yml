name: V267 workspace label fixture fix
on:
  push:
    branches:
      - design/v267-premium-workspace
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v267-premium-workspace
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update document upload locator and integrity inventory
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const testPath='tests/v267-workspace-tools.e2e.mjs';
          const oldLabel="getByLabel('تصوير المستند أو اختيار صورة',{exact:true})";
          const newLabel="getByLabel('تصوير المستند أو اختيار ملف',{exact:true})";
          let source=fs.readFileSync(testPath,'utf8');
          const count=source.split(oldLabel).length-1;
          if(count!==1) throw new Error('Expected exactly one stale upload label, found '+count);
          source=source.replace(oldLabel,newLabel);
          fs.writeFileSync(testPath,source);
          const invPath='FILE_INVENTORY.json';
          const inv=JSON.parse(fs.readFileSync(invPath,'utf8'));
          const row=inv.files.find(x=>x.path===testPath);
          if(!row) throw new Error('Inventory entry missing for '+testPath);
          const bytes=fs.readFileSync(testPath);
          row.size=bytes.length;
          row.sha256=crypto.createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(invPath,JSON.stringify(inv,null,2)+'\n');
          NODE
          git rm .github/workflows/v267-workspace-label-fix.yml
      - name: Commit exact fixture repair
        run: |
          git config user.name 'aqari-ci'
          git config user.email 'aqari-ci@users.noreply.github.com'
          git add tests/v267-workspace-tools.e2e.mjs FILE_INVENTORY.json
          git commit -m 'Fix V267 document upload E2E locator [fixture-repair]'
          git push origin HEAD:design/v267-premium-workspace
