name: Prepare direct entry patch
on:
  push:
    branches: [fix/v266-root]
    paths: [.github/workflows/direct-entry-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed patch on the fix branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/v266-root
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected = {
              'vercel.json':'2c3a8cf12f0f1a122baff3ce71fddb9be63b8e68',
              'tests/mobile-login-shell.test.cjs':'01cc0fff899daecd85f2c0048ddba72891affc33',
              'tests/preview.e2e.mjs':'ffab16e55cd86b47b30d007cae94d17924781c8b',
              '.github/workflows/preview-e2e.yml':'35fd346748705128e1e5c3b0274c8ae3f9e2c5f2',
              'FILE_INVENTORY.json':'4fa0a95700781579534165c320b36181a3453756'
          }
          for name,sha in expected.items():
              b=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha, name+' changed since review'
          p=Path('vercel.json'); config=json.loads(p.read_text())
          assert config['redirects']==[{'source':'/','destination':'/login?release=V266','permanent':False}]
          del config['redirects']
          config['rewrites'].insert(0,{'source':'/','destination':'/login.html'})
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n')
          p=Path('tests/mobile-login-shell.test.cjs');s=p.read_text()
          old="""const redirect = (source) => config.redirects.find((item) => item.source === source);
          assert.equal(redirect('/')?.destination, '/login?release=V266');
          assert.equal(redirect('/')?.has, undefined, 'root login redirect must also cover iPad desktop mode');
          assert.equal(redirect('/')?.permanent, false);"""
          new="""const redirect = (source) => (config.redirects || []).find((item) => item.source === source);
          assert.equal(redirect('/'), undefined, 'root must not require an extra browser navigation');
          assert.equal(rewrite('/')?.destination, '/login.html');
          assert.equal(rewrite('/')?.has, undefined, 'direct root entry must include iPad desktop mode');
          assert.equal(config.rewrites.filter(item => item.source === '/').length, 1);"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/preview.e2e.mjs');s=p.read_text()
          old="""    if(finalUrl.pathname !== '/login' || finalUrl.searchParams.get('release') !== 'V266'){
                throw new Error('root did not redirect to the V266 login: ' + finalUrl.toString());
              }"""
          new="""    if(finalUrl.pathname !== '/' || response.request().redirectedFrom() || response.headers().location){
                throw new Error('root must serve the login directly without redirecting');
              }"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('.github/workflows/preview-e2e.yml');s=p.read_text()
          assert s.count('npx playwright install --with-deps chromium')==1
          s=s.replace('npx playwright install --with-deps chromium','npx playwright install --with-deps chromium webkit')
          s+='      - name: Direct root entry with scripts unavailable\n        run: node tests/direct-entry.e2e.mjs\n'
          p.write_text(s)
          Path('tests/direct-entry.e2e.mjs').write_text("import { chromium, webkit } from 'playwright';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst base = new URL(process.env.AQARI_BASE_URL || 'https://myaqari.com');\nassert.equal(base.protocol, 'https:');\nconst bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';\nconst output = 'test-results/direct-entry';\nfs.mkdirSync(output, { recursive:true });\nconst results = [];\ntry {\n  for (const [engineName, engine] of [['chromium',chromium],['webkit',webkit]]) {\n    const browser = await engine.launch({ headless:true });\n    try {\n      for (const mode of ['normal','scripts-blocked','javascript-disabled']) {\n        const context = await browser.newContext({\n          viewport:{ width:1473, height:850 },\n          javaScriptEnabled:mode !== 'javascript-disabled',\n          extraHTTPHeaders:bypass ? { 'x-vercel-protection-bypass':bypass } : {}\n        });\n        try {\n          // Fresh signed-out contexts only. Never forward the Preview secret\n          // outside this deployment or contact an authenticated data backend.\n          await context.route('**/*', route => {\n            const request = route.request();\n            const url = new URL(request.url());\n            if (url.origin !== base.origin || (mode === 'scripts-blocked' && url.pathname.endsWith('.js'))) return route.abort();\n            return route.continue();\n          });\n          const page = await context.newPage();\n          const errors = [];\n          page.on('pageerror', error => errors.push(error.message));\n          const target = new URL(mode === 'scripts-blocked' ? '/?manual=1' : '/', base);\n          const started = Date.now();\n          const response = await page.goto(target.href, { waitUntil:'domcontentloaded', timeout:30000 });\n          assert.equal(response?.status(), 200, 'root must serve HTML, not a 30x');\n          assert.equal(response.request().redirectedFrom(), null, 'root must have no HTTP redirect');\n          assert.equal(response.headers().location, undefined);\n          assert.equal(page.url(), target.href, 'the requested root URL and query must remain intact');\n          await page.locator('#email').waitFor({ state:'visible', timeout:5000 });\n          assert.ok(await page.locator('#password').isVisible());\n          assert.ok(await page.locator('#loginButton').isEnabled());\n          assert.equal(await page.locator('#aqariCloudGateV168').count(), 0, 'do not load the private app shell at root');\n          assert.equal(await page.locator('#home').count(), 0);\n          assert.deepEqual(errors, []);\n          const result = { engine:engineName, mode, status:response.status(), redirects:0, path:target.pathname, formVisible:true, observedMs:Date.now()-started };\n          results.push(result);\n          await page.screenshot({ path:output+'/'+engineName+'-'+mode+'.png' });\n          console.log('DIRECT_ENTRY', JSON.stringify(result));\n        } finally { await context.close(); }\n      }\n    } finally { await browser.close(); }\n  }\n} finally {\n  fs.writeFileSync(output+'/results.json', JSON.stringify({ note:'Fresh signed-out CI browsers; not measurements from the owner iPad', results }, null, 2));\n}\n")
          Path('.github/workflows/direct-entry.yml').write_text('name: Production direct entry\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  entry:\n    runs-on: ubuntu-latest\n    timeout-minutes: 8\n    env:\n      AQARI_BASE_URL: https://myaqari.com\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm install\n      - run: npx playwright install --with-deps chromium webkit\n      - name: Wait for this production deployment\n        run: |\n          for attempt in $(seq 1 30); do\n            body=$(curl --max-time 10 -fsS "$AQARI_BASE_URL/api/production-meta" || true)\n            if printf \'%s\' "$body" | grep -Fq "$GITHUB_SHA" && printf \'%s\' "$body" | grep -Fq \'"environment":"production"\'; then\n              exit 0\n            fi\n            sleep 5\n          done\n          echo \'Matching production deployment not available.\' >&2\n          exit 1\n      - run: node tests/direct-entry.e2e.mjs\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: production-direct-entry\n          path: test-results/direct-entry\n          retention-days: 2\n')
          changed=['vercel.json','tests/mobile-login-shell.test.cjs','tests/preview.e2e.mjs','.github/workflows/preview-e2e.yml','tests/direct-entry.e2e.mjs','.github/workflows/direct-entry.yml']
          p=Path('FILE_INVENTORY.json');inventory=json.loads(p.read_text())
          by_path={entry['path']:entry for entry in inventory['files']}
          for name in changed:
              b=Path(name).read_bytes()
              entry={'path':name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              if name in by_path: by_path[name].update(entry)
              else: inventory['files'].append(entry)
          p.write_text('{"version":"V198","files":[\n'+',\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in inventory['files'])+'\n]}\n')
          Path('.github/workflows/direct-entry-prepare.yml').unlink()
          PY
      - name: Static and navigation regressions
        run: |
          node --check tests/direct-entry.e2e.mjs
          node --test tests/mobile-login-shell.test.cjs tests/login-navigation.test.cjs tests/v266-startup-snapshot.test.cjs
          npm run check:freeze
      - name: Commit only the direct-entry patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json tests/mobile-login-shell.test.cjs tests/preview.e2e.mjs .github/workflows/preview-e2e.yml tests/direct-entry.e2e.mjs .github/workflows/direct-entry.yml FILE_INVENTORY.json .github/workflows/direct-entry-prepare.yml
          git commit -m "fix: serve the root login without a browser redirect"
          git push origin HEAD:fix/v266-root
