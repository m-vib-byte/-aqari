name: AQARI Preview E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    if: ${{ secrets.AQARI_PREVIEW_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Preview E2E
        run: npm run test:e2e
        env:
          AQARI_BASE_URL: ${{ secrets.AQARI_PREVIEW_URL }}
