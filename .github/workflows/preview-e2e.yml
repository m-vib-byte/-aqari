name: AQARI Preview E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: aqari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AQARI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AQARI_PROJECT_SLUG: aqari
      AQARI_TEAM_SLUG: m-vib-5421
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve branch Preview URL
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          slug=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/_]+#-#g; s#[^a-z0-9-]+#-#g; s#-+#-#g; s#^-##; s#-$##')
          test -n "$slug"
          echo "AQARI_BASE_URL=https://${AQARI_PROJECT_SLUG}-git-${slug}-${AQARI_TEAM_SLUG}.vercel.app" >> "$GITHUB_ENV"
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Require protected Preview access
        run: |
          test -n "$AQARI_BASE_URL"
          test -n "$AQARI_EXPECTED_SHA"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo 'Configure the repository secret VERCEL_AUTOMATION_BYPASS_SECRET for the matching Preview.' >&2
            exit 1
          fi
      - name: Wait for matching Vercel Preview
        run: |
          for attempt in $(seq 1 45); do
            body=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$AQARI_BASE_URL/api/production-meta" 2>/dev/null || true)
            if printf '%s' "$body" | grep -Fq "$AQARI_EXPECTED_SHA" && printf '%s' "$body" | grep -Fq '"environment":"preview"'; then
              echo "Matching Preview is ready."
              exit 0
            fi
            echo "Waiting for Preview commit (attempt $attempt/45)..."
            sleep 10
          done
          echo "Matching Vercel Preview was not ready in time." >&2
          exit 1
      - name: Preview E2E
        run: npm run test:e2e
      - name: Direct root entry with scripts unavailable
        run: node tests/direct-entry.e2e.mjs
