name: AQARI Preview E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AQARI_BASE_URL: https://aqari-git-release-v202-m-vib-5421.vercel.app
      AQARI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Require protected Preview access
        run: |
          test -n "$AQARI_BASE_URL"
          test -n "$AQARI_EXPECTED_SHA"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && ! printf '%s' "$AQARI_BASE_URL" | grep -Eq '(_vercel_share|x-vercel-protection-bypass)='; then
            echo 'Configure VERCEL_AUTOMATION_BYPASS_SECRET or a protected share URL.' >&2
            exit 1
          fi
      - name: Preview E2E
        run: npm run test:e2e
