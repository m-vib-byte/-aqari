name: AQARI Preview E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: aqari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AQARI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AQARI_PROJECT_SLUG: aqari
      AQARI_TEAM_SLUG: m-vib-5421
      AQARI_PREVIEW_AUTH: github-oidc
      AQARI_PREVIEW_OIDC_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked out Preview revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$AQARI_EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Preview credential boundaries
        run: node --test tests/preview-access.test.cjs tests/github-preview-oidc.test.cjs
      - name: Resolve exact Vercel Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.AQARI_EXPECTED_SHA;
          const project=process.env.AQARI_PROJECT_SLUG,team=process.env.AQARI_TEAM_SLUG,token=process.env.GH_TOKEN;
          if(!repo||!/^[a-f0-9]{40}$/.test(sha||'')||!project||!team||!token)throw Error('Preview URL resolver configuration is incomplete.');
          const headers={accept:'application/vnd.github+json',authorization:'Bearer '+token,'x-github-api-version':'2022-11-28'};
          const deployments=await fetch(`https://api.github.com/repos/${repo}/deployments?sha=${sha}&per_page=20`,{headers,redirect:'error'});
          if(!deployments.ok)throw Error('Unable to read GitHub deployments for this SHA (HTTP '+deployments.status+').');
          const rows=await deployments.json();
          let base='';
          for(const deployment of rows){
            const statuses=await fetch(`https://api.github.com/repos/${repo}/deployments/${deployment.id}/statuses?per_page=20`,{headers,redirect:'error'});
            if(!statuses.ok)continue;
            for(const status of await statuses.json()){
              const candidate=status.environment_url||status.target_url;
              if(!candidate)continue;
              let url;try{url=new URL(candidate);}catch{continue;}
              if(url.protocol!=='https:'||url.username||url.password||url.port||url.search||url.hash||url.pathname!=='/')continue;
              if(!url.hostname.endsWith(`-${team}.vercel.app`))continue;
              if(!url.hostname.startsWith(project+'-'))continue;
              base=url.origin+'/';break;
            }
            if(base)break;
          }
          if(!base)throw Error('No Vercel Preview deployment URL is registered for the exact SHA.');
          appendFileSync(process.env.GITHUB_ENV,'AQARI_BASE_URL='+base+'\n');
          console.log('Resolved exact Vercel Preview deployment URL for '+sha+'.');
          NODE
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Require protected Preview access
        run: |
          test -n "$AQARI_BASE_URL"
          test -n "$AQARI_EXPECTED_SHA"
          test "$AQARI_PREVIEW_AUTH" = 'github-oidc'
          node --input-type=module -e "import { createGitHubOidcTokenProvider } from './tests/github-preview-oidc.mjs'; await createGitHubOidcTokenProvider()(); console.log('Short-lived GitHub Preview identity acquired.');"
      - name: Wait for matching Vercel Preview
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { githubPreviewAccess } from './tests/github-preview-oidc.mjs';
          // Keep this gate fail-closed: never follow an authentication redirect,
          // print the automation credential, or accept an unrelated SHA in JSON.
          async function waitForMatchingPreview() {
            const { AQARI_BASE_URL: base, AQARI_EXPECTED_SHA: expectedSha,
              AQARI_PROJECT_SLUG: project, AQARI_TEAM_SLUG: team } = process.env;
            if (process.env.AQARI_PREVIEW_AUTH !== 'github-oidc' || !/^[a-f0-9]{40}$/.test(expectedSha || '')) {
              throw new Error('Preview gate configuration is incomplete.');
            }
            let url;
            try { url = new URL(base); } catch {
              throw new Error('Preview gate URL is invalid.');
            }
            if (!project || !team || url.protocol !== 'https:' || url.username ||
                url.password || url.port || url.search || url.hash || url.pathname !== '/' ||
                !url.hostname.startsWith(`${project}-`) ||
                !url.hostname.endsWith(`-${team}.vercel.app`)) {
              throw new Error('Preview gate requires this project branch Preview URL.');
            }
            url.pathname = '/api/production-meta';
            const access = githubPreviewAccess(base);
            const deadline = Date.now() + 450_000;
            let lastState = 'not checked';
            for (let attempt = 1; attempt <= 45 && Date.now() < deadline; attempt++) {
              const headers = await access.headersFor(url, { accept: 'application/json' });
              let response;
              try {
                response = await fetch(url, {
                  headers,
                  redirect: 'manual', signal: AbortSignal.timeout(10_000)
                });
              } catch {
                lastState = 'network request failed or timed out';
              }
              if (response) {
                const status = response.status;
                console.log(`Preview metadata attempt ${attempt}: HTTP ${status}.`);
                if ((status >= 300 && status < 400) || status === 401 || status === 403) {
                  throw new Error(`Preview access not authorized (HTTP ${status}). Check this workflow's GitHub OIDC trusted-source claims and Preview environment; no redirect was followed.`);
                }
                if (status === 200) {
                  let metadata;
                  try {
                    const text = await response.text();
                    if (text.length > 65_536) throw new Error('oversized');
                    metadata = JSON.parse(text);
                  } catch {
                    throw new Error('Preview metadata is not a valid bounded JSON response.');
                  }
                  if (!metadata || metadata.ok !== true || metadata.app !== 'AQARI' ||
                      metadata.deployment?.environment !== 'preview' ||
                      !/^[a-f0-9]{40}$/.test(metadata.deployment?.gitSha || '')) {
                    throw new Error('Preview metadata identity is invalid or targets a non-Preview environment.');
                  }
                  if (metadata.deployment.gitSha === expectedSha) {
                    console.log(`Matching Preview verified at SHA ${expectedSha}.`);
                    return;
                  }
                  lastState = `Preview is on a different SHA (${metadata.deployment.gitSha})`;
                } else if ([404, 408, 429, 500, 502, 503, 504].includes(status)) {
                  lastState = `Preview not ready (HTTP ${status})`;
                } else {
                  throw new Error(`Unexpected Preview metadata HTTP status ${status}.`);
                }
              }
              console.log(lastState);
              const remaining = deadline - Date.now();
              if (attempt < 45 && remaining > 0) {
                await new Promise(resolve => setTimeout(resolve, Math.min(10_000, remaining)));
              }
            }
            throw new Error(`Matching Preview did not become ready: ${lastState}.`);
          }
          try {
            await waitForMatchingPreview();
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE
      - name: Preview E2E
        run: npm run test:e2e
      - name: Direct root entry with scripts unavailable
        run: node tests/direct-entry.e2e.mjs
