name: AQARI Preview E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional Vercel Preview URL override
        required: false
        type: string
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AQARI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AQARI_BASE_URL_OVERRIDE: ${{ inputs.base_url || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Resolve matching Vercel Preview
        shell: bash
        run: |
          if [ -n "$AQARI_BASE_URL_OVERRIDE" ]; then
            base="$AQARI_BASE_URL_OVERRIDE"
          else
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            slug=$(printf '%s' "$branch" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[/_]+#-#g; s#[^a-z0-9-]+#-#g; s#-+#-#g; s#^-##; s#-$##')
            test -n "$slug"
            base="https://aqari-git-${slug}-m-vib-5421.vercel.app"
          fi
          printf 'AQARI_BASE_URL=%s\n' "$base" >> "$GITHUB_ENV"
          echo "Preview target: $base"
      - name: Require protected Preview access
        run: |
          test -n "$AQARI_BASE_URL"
          test -n "$AQARI_EXPECTED_SHA"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && ! printf '%s' "$AQARI_BASE_URL" | grep -Eq '(_vercel_share|x-vercel-protection-bypass)='; then
            echo 'Configure VERCEL_AUTOMATION_BYPASS_SECRET or a protected share URL.' >&2
            exit 1
          fi
      - name: Wait for matching Vercel Preview
        run: |
          for attempt in $(seq 1 45); do
            body=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$AQARI_BASE_URL/api/production-meta" 2>/dev/null || true)
            if printf '%s' "$body" | grep -Fq "$AQARI_EXPECTED_SHA" && printf '%s' "$body" | grep -Fq '"environment":"preview"'; then
              echo "Matching Preview is ready."
              exit 0
            fi
            echo "Waiting for Preview commit (attempt $attempt/45)..."
            sleep 10
          done
          echo "Matching Vercel Preview was not ready in time." >&2
          exit 1
      - name: Preview E2E
        run: npm run test:e2e
