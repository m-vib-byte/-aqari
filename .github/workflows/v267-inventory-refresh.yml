name: V267 inventory refresh
on:
  push:
    branches:
      - design/v267-premium-workspace
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v267-premium-workspace
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute existing inventory and add the new vacating sources
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const path='FILE_INVENTORY.json';
          const inv=JSON.parse(fs.readFileSync(path,'utf8'));
          const additions=['src/v267/pages/vacating-settlement.js','staging-database/sql/vacating-settlement.sql'];
          for(const p of additions){if(!inv.files.some(x=>x.path===p))inv.files.push({path:p,sha256:'',size:0});}
          for(const row of inv.files){
            if(!fs.existsSync(row.path))throw new Error('Inventory path missing: '+row.path);
            const bytes=fs.readFileSync(row.path);
            row.size=bytes.length;
            row.sha256=crypto.createHash('sha256').update(bytes).digest('hex');
          }
          fs.writeFileSync(path,JSON.stringify(inv,null,2)+'\n');
          NODE
      - name: Commit inventory only when changed
        run: |
          if git diff --quiet -- FILE_INVENTORY.json; then
            echo 'Inventory already current.'
            exit 0
          fi
          git config user.name 'aqari-ci'
          git config user.email 'aqari-ci@users.noreply.github.com'
          git add FILE_INVENTORY.json
          git commit -m 'Refresh V267 integrity inventory [inventory-refresh]'
          git push origin HEAD:design/v267-premium-workspace
