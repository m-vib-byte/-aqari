name: V267 inventory refresh
on:
  push:
    branches:
      - design/v267-premium-workspace
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v267-premium-workspace
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute release inventory
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const path='FILE_INVENTORY.json';
          const inv=JSON.parse(fs.readFileSync(path,'utf8'));
          const additions=['staging-database/sql/tenant-contact-preference.sql','staging-database/tests/imported_tenant_edit.sql','staging-database/tests/reminder_contract_balance.sql','tests/imported-tenant-editor.test.mjs'];
          for(const p of additions){if(!inv.files.some(x=>x.path===p))inv.files.push({path:p,sha256:'',size:0});}
          for(const row of inv.files){if(!fs.existsSync(row.path))throw new Error('Inventory path missing: '+row.path);const bytes=fs.readFileSync(row.path);row.size=bytes.length;row.sha256=crypto.createHash('sha256').update(bytes).digest('hex');}
          fs.writeFileSync(path,JSON.stringify(inv,null,2)+'\n');
          NODE
      - name: Commit inventory only when changed
        run: |
          if git diff --quiet -- FILE_INVENTORY.json; then exit 0; fi
          git config user.name 'aqari-ci'
          git config user.email 'aqari-ci@users.noreply.github.com'
          git add FILE_INVENTORY.json
          git commit -m 'Refresh V267 integrity inventory [inventory-refresh]'
          git push origin HEAD:design/v267-premium-workspace
