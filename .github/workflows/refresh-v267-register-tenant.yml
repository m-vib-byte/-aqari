name: Refresh V267 tenant requirement evidence

on:
  push:
    branches:
      - fix/v267-preserve-tenant-history
    paths:
      - .github/workflows/refresh-v267-register-tenant.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-preserve-tenant-history
      - name: Close only proven tenant requirements
        shell: python
        run: |
          import hashlib, json, pathlib
          path = pathlib.Path('docs/V267-REQUIREMENTS-155.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
          "| 28 | G03-05 | تسجيل وسيلة التواصل المفضلة. | ناقص — E07، E17 لا يثبتان تفضيلاً محفوظاً تتحكم به قنوات الإرسال. | حفظ تفضيل المستأجر وربطه بسياسة الإرسال وتعديله مع التدقيق. |":
          "| 28 | G03-05 | تسجيل وسيلة التواصل المفضلة. | مطبق بدليل — [مسار ملف المستأجر](../v267-rental-records.js)، [سياسة قنوات الإرسال](../staging-database/sql/tenant-contact-preference.sql)، [اختبار الحفظ والواجهة](../tests/v267-rental-records.test.cjs)، [اختبار PostgreSQL المعزول](../staging-database/tests/tenant_contact_preference.sql). | حفظ/تعديل التفضيل وإعادة قراءته؛ القيم `both/email/whatsapp/phone/none` تتحكم في الإرسال الآلي وتُرفض القيمة غير الصالحة. |",
          "| 30 | G03-07 | الاحتفاظ بسجل المستأجر التاريخي وعدم حذفه. | جزئي — E09 يحفظ السجلات الحساسة؛ دورة الإخلاء التاريخية الكاملة غير مكتملة. | إخلاء وتسكين لاحق مع بقاء الملف والعقود والمدفوعات والمستندات السابقة. |":
          "| 30 | G03-07 | الاحتفاظ بسجل المستأجر التاريخي وعدم حذفه. | مطبق بدليل — [إطلاق الوحدة بعد التسوية](../staging-database/sql/vacating-release.sql) و[اختبار الإخلاء التاريخي المعزول](../staging-database/tests/vacating_release.sql) يثبتان بقاء المستأجر والعقد المنتهي والدفعة ومحضر التسليم، ثم السماح بعقد لاحق دون حذف التاريخ. | يبقى الملف والعقد والمدفوعات والمستندات السابقة بعد الإخلاء، مع تحرير الوحدة للعقد اللاحق ومنع تداخل يوم الإخلاء. |"
          }
          for old,new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit('REGISTER_ROW_CHANGED')
              text = text.replace(old,new)
          path.write_text(text,encoding='utf-8')

          inventory_path=pathlib.Path('FILE_INVENTORY.json')
          data=json.loads(inventory_path.read_text(encoding='utf-8'))
          entries={entry['path']:entry for entry in data['files']}
          target=str(path)
          payload=path.read_bytes()
          entry=entries.get(target)
          if entry is not None:
              entry['size']=len(payload);entry['sha256']=hashlib.sha256(payload).hexdigest()
              print(target,entry['size'],entry['sha256'])
          else:
              print('register not release-inventoried')
          inventory_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit verified register evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/V267-REQUIREMENTS-155.md FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'docs(v267): close proven tenant requirements'
          git push origin HEAD:fix/v267-preserve-tenant-history
