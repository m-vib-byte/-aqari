name: Patch V267 service desk maintenance fixture

on:
  push:
    branches:
      - fix/v267-maintenance-request-attachments
    paths:
      - .github/workflows/patch-v267-service-desk-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-maintenance-request-attachments
      - name: Patch service desk fixture only
        shell: python
        run: |
          import pathlib
          p=pathlib.Path('tests/v267-service-desk.test.cjs')
          text=p.read_text(encoding='utf-8')
          def one(old,new):
              global text
              if text.count(old)!=1:
                  raise SystemExit('ANCHOR_CHANGED:'+old[:120])
              text=text.replace(old,new)
          one("description:'طلب اختبار '+i,status:'received'", "description:'طلب اختبار '+i,request_type:'general',status:'received'")
          one("const context={node,field,createDialog:()=>d,currentScope:()=>({role:'general_manager'}),t:x=>x,message:", "const context={node,field,createDialog:()=>d,currentScope:()=>({role:'general_manager'}),maintenanceTypeLabel:x=>({general:'عام',electrical:'كهرباء',plumbing:'سباكة',air_conditioning:'تكييف',elevator:'مصعد',fire_safety:'إطفاء وسلامة',other:'أخرى'}[x]||'أخرى'),t:x=>x,message:")
          p.write_text(text,encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing service desk suite without relaxed assertions
        run: node --test tests/v267-service-desk.test.cjs tests/v267-maintenance-request.test.mjs
      - name: Commit fixture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v267-service-desk.test.cjs
          git diff --cached --check
          git commit -m 'test(v267): load maintenance type helper in service desk fixture'
          git push origin HEAD:fix/v267-maintenance-request-attachments
