name: Archive integrity verification

on:
  push:
    branches: [fix/v267-archive-integrity]

permissions:
  contents: read

concurrency:
  group: archive-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive behavior regression
        run: node --test tests/v267-financial-archive.test.cjs tests/v267-financial-archive-runtime.test.mjs
      - run: npm install --ignore-scripts --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - name: Native browser and download verification
        run: node tests/v267-financial-archive.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-browser-evidence
          path: archive-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

  refresh-inventory:
    needs: verify
    if: github.repository == 'm-vib-byte/-aqari' && github.ref == 'refs/heads/fix/v267-archive-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh only verified repair checksums
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path
          verified = {
              'src/v267/pages/financial-archive.js': 'ffc66df90525f9e83d2a80ae863e4d023409a38782bf762941677a809dd305ea',
              'tests/v267-financial-archive.test.cjs': '80a55313e62515ebef0cd93ae94221aedbfa7533149f60b3d22b18a923b6f45c',
              'tests/v267-financial-archive-runtime.test.mjs': '13dcea67f325c57f551cd7f054aa3003b66b2131a6cef23fd3dc70ca19b83f5f',
              'tests/v267-financial-archive.browser.mjs': '7dd27c2c9127162d7269e1ea681a1d29b39f0ab21ff9f33415e16aa6e342fbb1',
          }
          for name, expected in verified.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          raw = Path('FILE_INVENTORY.json').read_bytes()
          actual_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          inventory = json.loads(raw)
          rows = {row['path']: row for row in inventory['files']}
          assert len(rows) == len(inventory['files']), 'Duplicate inventory paths'
          evidence_path = Path('docs/V267-EVIDENCE-155.json')
          before_evidence = json.loads(evidence_path.read_text())
          subprocess.run(['node', 'scripts/audit-v267-evidence.mjs', '--write'], check=True)
          after_evidence = json.loads(evidence_path.read_text())
          assert {k:v for k,v in before_evidence.items() if k != 'files'} == {k:v for k,v in after_evidence.items() if k != 'files'}, 'Evidence acceptance or mapping changed'
          before_files = {row['path']: row for row in before_evidence['files']}
          after_files = {row['path']: row for row in after_evidence['files']}
          assert before_files.keys() == after_files.keys(), 'Evidence file set changed'
          for name, row in before_files.items():
              if name not in verified:
                  assert row == after_files[name], 'Unrelated evidence changed: ' + name
          paths = [*verified, '.github/workflows/archive-integrity.yml', str(evidence_path)]
          desired = {}
          for name in paths:
              data = Path(name).read_bytes()
              desired[name] = {'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          if actual_blob != '0381adf416332aa5d0d2c67a3f24ad3e44ae7e4b':
              assert all(rows.get(name) == row for name, row in desired.items()), 'Inventory base changed; reconcile before writing'
              print('Verified repair inventory already matches; no rewrite.')
          else:
              assert all(name in rows for name in list(verified)[:2])
              for name, row in desired.items():
                  if name in rows:
                      rows[name].update(row)
                  else:
                      inventory['files'].append(row)
              Path('FILE_INVENTORY.json').write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n')
              print('Preserved concurrent fixes; refreshed only archive and evidence checksums.')
      - name: Verify the combined inventory and evidence
        run: |
          node scripts/release-freeze-selftest.mjs
          node --test tests/v267-evidence-matrix.test.mjs tests/v267-financial-archive.test.cjs tests/v267-financial-archive-runtime.test.mjs
      - name: Commit inventory on repair branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- FILE_INVENTORY.json docs/V267-EVIDENCE-155.json; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_INVENTORY.json docs/V267-EVIDENCE-155.json
          git commit -m 'Reconcile tested archive inventory and evidence without losing concurrent V267 repairs'
          git push origin HEAD:refs/heads/fix/v267-archive-integrity
