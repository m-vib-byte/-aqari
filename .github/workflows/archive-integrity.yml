name: Archive integrity verification

on:
  push:
    branches: [fix/v267-archive-integrity]

permissions:
  contents: read

concurrency:
  group: archive-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive behavior regression
        run: node --test tests/v267-financial-archive.test.cjs
      - run: npm install --ignore-scripts --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - name: Native browser and download verification
        run: node tests/v267-financial-archive.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-browser-evidence
          path: archive-browser-evidence/
          if-no-files-found: warn
          retention-days: 14

  refresh-inventory:
    needs: verify
    if: github.repository == 'm-vib-byte/-aqari' && github.ref == 'refs/heads/fix/v267-archive-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Refresh only verified repair checksums
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          verified = {
              'src/v267/pages/financial-archive.js': '7f72ed6d0c1bb19a6de5aca374fe2eaa66acc88999a46e1f53d456de31a8c130',
              'tests/v267-financial-archive.test.cjs': '3b4097cc4913a8617fdc0377ba9426caeae1e88a8f3ee09fbd9c59eb753aaee7',
              'tests/v267-financial-archive.browser.mjs': '97b27ca35a324a070abde1592f2dcf42af345eb41a4ee1af92d29aa8b2ecc234',
          }
          for name, expected in verified.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          raw = Path('FILE_INVENTORY.json').read_bytes()
          actual_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          inventory = json.loads(raw)
          rows = {row['path']: row for row in inventory['files']}
          assert len(rows) == len(inventory['files']), 'Duplicate inventory paths'
          paths = [*verified, '.github/workflows/archive-integrity.yml']
          desired = {}
          for name in paths:
              data = Path(name).read_bytes()
              desired[name] = {'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          if actual_blob != 'ce97ec7d5b2fb4fcf5306bc455d1a4ded4c4c8ea':
              assert all(rows.get(name) == row for name, row in desired.items()), 'Inventory base changed; reconcile before writing'
              print('Verified repair inventory already matches; no rewrite.')
          else:
              assert all(name in rows for name in list(verified)[:2])
              for name, row in desired.items():
                  if name in rows:
                      rows[name].update(row)
                  else:
                      inventory['files'].append(row)
              Path('FILE_INVENTORY.json').write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n')
              print('Refreshed only the four verified archive repair entries.')
      - name: Commit inventory on repair branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- FILE_INVENTORY.json; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_INVENTORY.json
          git commit -m 'Refresh verified archive repair inventory after browser tests'
          git push origin HEAD:refs/heads/fix/v267-archive-integrity
