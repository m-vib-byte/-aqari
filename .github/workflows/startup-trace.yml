name: Prepare startup observability
on:
  push:
    branches: [fix/v266-startup-trace]
    paths: [.github/workflows/startup-trace.yml]
permissions:
  contents: write
concurrency:
  group: prepare-startup-observability
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add stage-only observability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          p=Path('secure-auth-bridge.js');s=p.read_text()
          assert 'installStartupTrace' not in s
          insertion="""
            // Independent anonymous diagnostics; never alters access decisions.
            function installStartupTrace(){
              if(typeof Worker !== 'function' || window.AQARI_STARTUP_TRACE) return;
              let worker;
              try{worker = new Worker('/startup-trace-worker.js');}catch(_){return;}
              let code = '';
              let heartbeat = 0;
              const labels = {
                starting:'بدء الفتح',session:'استعادة الجلسة','verify-user':'التحقق من الحساب',
                'workspace-snapshot':'استلام بيانات مساحة العمل','verify-session-final':'تأكيد الجلسة الأولى',
                data:'تحميل البيانات','confirm-access':'تأكيد صلاحية الوصول','confirm-session-final':'تأكيد الجلسة النهائي',
                render:'تجهيز الرئيسية','activate-data':'تهيئة البيانات المحلية','legacy-session':'تهيئة جلسة الواجهة',
                'render-home':'رسم الصفحة الرئيسية','show-home':'إظهار الرئيسية',ready:'اكتمل الفتح'
              };
              function post(message){try{worker.postMessage({...message,code});}catch(_){ }}
              function stage(value){
                if(!code || !Object.prototype.hasOwnProperty.call(labels,value)) return;
                post({type:'stage',stage:value});
                const message = byId('cloudGateMsgV168');
                let indicator = byId('aqariStartupDiagnostic');
                if(message && !indicator){
                  indicator = document.createElement('small');indicator.id = 'aqariStartupDiagnostic';
                  indicator.style.cssText = 'display:block;margin-top:12px;line-height:1.8;text-align:center;color:#746b5d';
                  message.insertAdjacentElement('afterend',indicator);
                }
                if(indicator) indicator.textContent = 'فحص الفتح: ' + labels[value] + ' • ' + code + ' • D1';
              }
              function finish(outcome){
                if(!code) return;
                post({type:'finish',outcome});clearInterval(heartbeat);heartbeat=0;
              }
              function start(){
                clearInterval(heartbeat);
                try{code = 'AQ-' + crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().padStart(8,'0');}
                catch(_){code = 'AQ-' + Math.floor(Math.random()*4294967296).toString(16).toUpperCase().padStart(8,'0');}
                post({type:'start'});stage('starting');
                heartbeat = setInterval(()=>post({type:'heartbeat',visible:!document.hidden}),1000);
              }
              window.AQARI_STARTUP_TRACE = Object.freeze({start,stage,finish});
              window.addEventListener('error',event=>{if(event.error) finish('script-error');});
              window.addEventListener('unhandledrejection',()=>finish('promise-error'));
              window.addEventListener('pagehide',()=>{clearInterval(heartbeat);post({type:'heartbeat',visible:false});});
            }
            installStartupTrace();
          """
          marker="  const byId = (id) => document.getElementById(id);"
          assert s.count(marker)==1;s=s.replace(marker,marker+'\n'+insertion)
          changes=[
            ("function setGatePhase(phase){", "function setGatePhase(phase){\n    if(phase === 'error') window.AQARI_STARTUP_TRACE?.finish('error');"),
            ("async function bootstrapOnce(generation, deadlineAt){\n    try{", "async function bootstrapOnce(generation, deadlineAt){\n    try{\n      window.AQARI_STARTUP_TRACE?.start();\n      window.AQARI_STARTUP_TRACE?.stage('session');"),
            ("window.activateWorkspaceDbV198(nextContext, nextRemoteState?.payload);", "window.AQARI_STARTUP_TRACE?.stage('activate-data');\n    window.activateWorkspaceDbV198(nextContext, nextRemoteState?.payload);"),
            ("    setCompatibility();", "    window.AQARI_STARTUP_TRACE?.stage('legacy-session');\n    setCompatibility();"),
            ("    if(typeof window.go === 'function') window.go('home');", "    window.AQARI_STARTUP_TRACE?.stage('render-home');\n    if(typeof window.go === 'function') window.go('home');"),
            ("      unlock(active, activeRemoteState);", "      window.AQARI_STARTUP_TRACE?.stage('render');\n      unlock(active, activeRemoteState);\n      window.AQARI_STARTUP_TRACE?.stage('ready');\n      window.AQARI_STARTUP_TRACE?.finish('ready');")
          ]
          for a,b in changes:
            assert s.count(a)==1,a;s=s.replace(a,b)
          p.write_text(s)
          p=Path('supabase-adapter.js');s=p.read_text()
          marker='function startupProgress(stage){';assert s.count(marker)==1
          s=s.replace(marker,marker+"\n    window.AQARI_STARTUP_TRACE?.stage(stage);")
          marker='    const {data:finalData,error:finalError} = await client.auth.getSession();'
          assert s.count(marker)==2
          first,second,third=s.split(marker)
          s=first+"    startupProgress('verify-session-final');\n"+marker+second+"    startupProgress('confirm-session-final');\n"+marker+third
          p.write_text(s)
          p=Path('FILE_INVENTORY.json');data=json.loads(p.read_text())
          for name in ['secure-auth-bridge.js','supabase-adapter.js','startup-trace-worker.js','api/startup-diagnostic.js']:
            raw=Path(name).read_bytes();entry={'path':name,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
            existing=next((v for v in data['files'] if v['path']==name),None)
            if existing is None:data['files'].append(entry)
            else:existing.update(entry)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check secure-auth-bridge.js
          node --check supabase-adapter.js
          node --check startup-trace-worker.js
          node --check api/startup-diagnostic.js
          node --test tests/auth-data-gate.test.cjs tests/v266-login-bootstrap.test.cjs tests/v266-startup-snapshot.test.cjs tests/login-navigation.test.cjs
          node scripts/release-freeze-selftest.mjs
      - name: Commit runtime observability only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secure-auth-bridge.js supabase-adapter.js FILE_INVENTORY.json
          git commit -m 'diagnostics: distinguish session, network, storage and render stalls'
          git push origin HEAD:fix/v266-startup-trace
