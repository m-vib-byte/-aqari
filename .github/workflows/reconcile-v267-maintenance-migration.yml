name: Reconcile V267 maintenance migration

on:
  push:
    branches:
      - fix/v267-maintenance-request-attachments
    paths:
      - .github/workflows/reconcile-v267-maintenance-migration.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-maintenance-request-attachments
      - name: Make policy creation transactionally repeatable
        shell: python
        run: |
          import hashlib,json,pathlib
          p=pathlib.Path('staging-database/sql/maintenance-request-details.sql')
          text=p.read_text(encoding='utf-8')
          replacements={
            "create policy maintenance_attachment_read on public.aqari_maintenance_attachments": "drop policy if exists maintenance_attachment_read on public.aqari_maintenance_attachments;\ncreate policy maintenance_attachment_read on public.aqari_maintenance_attachments",
            "create policy v267_maintenance_attachment_upload on storage.objects": "drop policy if exists v267_maintenance_attachment_upload on storage.objects;\ncreate policy v267_maintenance_attachment_upload on storage.objects",
            "create policy v267_maintenance_attachment_read on storage.objects": "drop policy if exists v267_maintenance_attachment_read on storage.objects;\ncreate policy v267_maintenance_attachment_read on storage.objects"
          }
          for old,new in replacements.items():
              if text.count(old)!=1: raise SystemExit('POLICY_ANCHOR_CHANGED:'+old)
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          inventory=pathlib.Path('FILE_INVENTORY.json');data=json.loads(inventory.read_text(encoding='utf-8'));entries={e['path']:e for e in data['files']}
          payload=p.read_bytes();entry=entries[str(p)];entry['size']=len(payload);entry['sha256']=hashlib.sha256(payload).hexdigest()
          inventory.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(str(p),entry['size'],entry['sha256'])
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify full isolated completion suite
        run: |
          npm ci --prefix staging-database/local-test --ignore-scripts
          npm run test:completion --prefix staging-database/local-test
      - name: Commit reconciled source and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-v267-maintenance-migration.yml
          git add staging-database/sql/maintenance-request-details.sql FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'fix(v267): make maintenance migration repeatable'
          git push origin HEAD:fix/v267-maintenance-request-attachments
