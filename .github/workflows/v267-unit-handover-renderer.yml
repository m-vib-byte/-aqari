name: V267 unit handover renderer

on:
  pull_request:

permissions:
  contents: read

jobs:
  handover-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify signed source bundle and archive integrity
        run: node --test tests/v267-unit-handover-bundle.test.mjs tests/v267-unit-handover-pdf-archive.test.mjs
      - name: Verify Arabic handover PDF renderer
        run: python -m unittest tests.unit_handover_pdf_test
