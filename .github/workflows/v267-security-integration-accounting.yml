name: V267 security integration accounting

on:
  pull_request:
    paths:
      - 'staging-database/sql/mfa-enforcement.sql'
      - 'staging-database/sql/partner-access-mfa-guard.sql'
      - 'staging-database/sql/external-integration-register.sql'
      - 'staging-database/sql/external-integration-public-metadata-hardening.sql'
      - 'src/v267/components/integration-public-metadata.js'
      - 'src/v267/pages/integration-center.js'
      - 'lib/accounting_provider_maps.py'
      - 'tests/v267-mfa-enforcement.test.cjs'
      - 'tests/v267-partner-access-mfa-guard.test.cjs'
      - 'tests/v267-integration-public-metadata-guard.test.mjs'
      - 'tests/accounting_provider_maps_test.py'
      - 'scripts/build-vercel.mjs'
      - '.github/workflows/v267-security-integration-accounting.yml'

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recent MFA, partner access and nested secret guards
        run: node --test tests/v267-mfa-enforcement.test.cjs tests/v267-partner-access-mfa-guard.test.cjs tests/v267-integration-public-metadata-guard.test.mjs
      - name: Accounting provider maps
        run: python -m unittest tests.accounting_provider_maps_test
