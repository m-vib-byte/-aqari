name: Patch V267 maintenance desk compatibility

on:
  push:
    branches:
      - fix/v267-maintenance-request-attachments
    paths:
      - .github/workflows/patch-v267-maintenance-service-desk-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-maintenance-request-attachments
      - name: Keep service desk self-contained for existing fixture
        shell: python
        run: |
          import pathlib
          p=pathlib.Path('v267-service-desk.js')
          text=p.read_text(encoding='utf-8')
          old="import {maintenanceTypeLabel} from './src/v267/components/maintenance-request.js';\n"
          new="const maintenanceTypeLabels={plumbing:'سباكة',electrical:'كهرباء',air_conditioning:'تكييف',elevator:'مصعد',fire_safety:'إطفاء',water:'مياه',general:'عام',other:'أخرى'};\nconst maintenanceTypeLabel=value=>maintenanceTypeLabels[value]||maintenanceTypeLabels.other;\n"
          if text.count(old)!=1:
              raise SystemExit('SERVICE_DESK_IMPORT_ANCHOR_CHANGED')
          p.write_text(text.replace(old,new),encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify desk and request tests
        run: node --test tests/v267-service-desk.test.cjs tests/v267-maintenance-request.test.mjs
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v267-service-desk.js
          git diff --cached --check
          git commit -m 'fix(v267): keep maintenance desk type labels fixture-safe'
          git push origin HEAD:fix/v267-maintenance-request-attachments
