name: Patch V267 maintenance tenant fixture

on:
  push:
    branches:
      - fix/v267-maintenance-request-attachments
    paths:
      - .github/workflows/patch-v267-maintenance-test-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-maintenance-request-attachments
      - name: Update tenant portal VM fixture for maintenance component
        shell: python
        run: |
          import hashlib,json,pathlib
          p=pathlib.Path('tests/v267-tenant-portal.test.cjs');text=p.read_text(encoding='utf-8')
          replacements=[
            (
              "'+moduleSource('src/v267/components/ui-text.js')+'\\n'+moduleSource('v267-tenant-portal.js');",
              "'+moduleSource('src/v267/components/ui-text.js')+'\\n'+moduleSource('src/v267/components/maintenance-request.js')+'\\n'+moduleSource('v267-tenant-portal.js');"
            ),
            (
              "for(const id of ['notice','content','auth','tenantName','tenantLeases','tenantPayments','tenantRequests','maintenanceLease','maintenanceForm','maintenanceDescription','maintenanceSave','tenantEmail','tenantPassword','tenantLogin','tenantSignup','tenantLogout','tenantLanguage'])$(id);",
              "for(const id of ['notice','content','auth','tenantName','tenantLeases','tenantPayments','tenantRequests','maintenanceLease','maintenanceType','maintenancePhotos','maintenanceForm','maintenanceDescription','maintenanceSave','tenantEmail','tenantPassword','tenantLogin','tenantSignup','tenantLogout','tenantLanguage'])$(id);$('maintenanceType').value='general';$('maintenancePhotos').files=[];"
            ),
            (
              "payments:[{reference:'R-A',amount:'125.750',paid_at:'2026-09-01'}],maintenance:[]};",
              "payments:[{reference:'R-A',amount:'125.750',paid_at:'2026-09-01'}],maintenance:[],maintenance_attachments:[]};"
            ),
            (
              "document:{documentElement:{},getElementById:$,createElement:()=>new Element(),querySelectorAll:selector=>selector==='button'?[$('tenantSignup'),$('tenantLogout'),$('maintenanceSave')]:all.filter(el=>el.dataset.aq267Text)}",
              "document:{documentElement:{},getElementById:$,createElement:()=>new Element(),createTextNode:text=>{const n=new Element();n.textContent=text;return n;},querySelectorAll:selector=>selector==='button'?[$('tenantSignup'),$('tenantLogout'),$('maintenanceSave')]:all.filter(el=>el.dataset.aq267Text)}"
            )
          ]
          for old,new in replacements:
              if text.count(old)!=1: raise SystemExit('TENANT_FIXTURE_ANCHOR_CHANGED:'+old[:100])
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          inventory=pathlib.Path('FILE_INVENTORY.json');data=json.loads(inventory.read_text(encoding='utf-8'));entries={e['path']:e for e in data['files']}
          payload=p.read_bytes();entry=entries.get(str(p))
          if entry is None: entry={'path':str(p)};data['files'].append(entry)
          entry['size']=len(payload);entry['sha256']=hashlib.sha256(payload).hexdigest()
          data['files'].sort(key=lambda e:e['path']);inventory.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tenant portal regression
        run: node --test tests/v267-tenant-portal.test.cjs tests/v267-maintenance-request.test.mjs
      - name: Commit verified fixture update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v267-tenant-portal.test.cjs FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'test(v267): load maintenance component in tenant portal fixture'
          git push origin HEAD:fix/v267-maintenance-request-attachments
