name: Refresh V267 vacating guard inventory

on:
  push:
    branches:
      - fix/v267-jsonb-readback
    paths:
      - .github/workflows/refresh-v267-vacating-guard-inventory.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-jsonb-readback
      - name: Refresh vacating guard inventory entry
        shell: python
        run: |
          import hashlib, json, pathlib
          target = pathlib.Path('staging-database/tests/vacating_settlement_guards.sql')
          inventory_path = pathlib.Path('FILE_INVENTORY.json')
          data = json.loads(inventory_path.read_text(encoding='utf-8'))
          entry = next((row for row in data['files'] if row['path'] == str(target)), None)
          if entry is None:
              raise SystemExit('INVENTORY_ENTRY_REQUIRED')
          payload = target.read_bytes()
          entry['size'] = len(payload)
          entry['sha256'] = hashlib.sha256(payload).hexdigest()
          inventory_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(str(target), entry['size'], entry['sha256'])
      - name: Commit inventory refresh and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refresh-v267-vacating-guard-inventory.yml
          git add FILE_INVENTORY.json .github/workflows/refresh-v267-vacating-guard-inventory.yml
          git diff --cached --check
          git commit -m 'test(v267): refresh vacating guard inventory'
          git push origin HEAD:fix/v267-jsonb-readback
