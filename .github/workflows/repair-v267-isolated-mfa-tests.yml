name: Repair V267 isolated MFA tests

on:
  push:
    branches:
      - fix/v267-jsonb-readback
    paths:
      - .github/workflows/repair-v267-isolated-mfa-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-jsonb-readback
      - name: Set AAL2 only for isolated privileged fixtures and refresh inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib

          edits = [
              (pathlib.Path('staging-database/tests/staff_property_scope.sql'), '76400000-0000-4000-8000-000000000001'),
              (pathlib.Path('staging-database/tests/staff_contract_approval.sql'), '76500000-0000-4000-8000-000000000001'),
          ]
          aal2 = '''select set_config('request.jwt.claims','{"aal":"aal2"}',true);'''
          inventory_path = pathlib.Path('FILE_INVENTORY.json')
          data = json.loads(inventory_path.read_text(encoding='utf-8'))

          for target, user_id in edits:
              text = target.read_text(encoding='utf-8')
              needle = f"select set_config('request.jwt.claim.sub','{user_id}',true);"
              if needle not in text:
                  raise SystemExit(f'MFA_FIXTURE_ANCHOR_REQUIRED:{target}')
              if aal2 not in text:
                  text = text.replace(needle, needle + '\n' + aal2, 1)
                  target.write_text(text, encoding='utf-8')
              entry = next((row for row in data['files'] if row['path'] == target.as_posix()), None)
              if entry is None:
                  raise SystemExit(f'INVENTORY_ENTRY_REQUIRED:{target}')
              payload = target.read_bytes()
              entry['size'] = len(payload)
              entry['sha256'] = hashlib.sha256(payload).hexdigest()
              print(target, entry['size'], entry['sha256'])

          inventory_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit isolated MFA fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging-database/tests/staff_property_scope.sql staging-database/tests/staff_contract_approval.sql FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'test(v267): exercise isolated sensitive writes at AAL2'
          git push origin HEAD:fix/v267-jsonb-readback
