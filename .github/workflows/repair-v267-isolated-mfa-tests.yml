name: Repair V267 isolated MFA tests

on:
  push:
    branches:
      - fix/v267-jsonb-readback
    paths:
      - .github/workflows/repair-v267-isolated-mfa-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-jsonb-readback
      - name: Set AAL2 only for isolated privileged fixtures
        shell: bash
        run: |
          set -euo pipefail
          scope='staging-database/tests/staff_property_scope.sql'
          approval='staging-database/tests/staff_contract_approval.sql'
          grep -Fq "select set_config('request.jwt.claim.sub','76400000-0000-4000-8000-000000000001',true);" "$scope"
          grep -Fq "select set_config('request.jwt.claim.sub','76500000-0000-4000-8000-000000000001',true);" "$approval"
          if ! grep -Fq "select set_config('request.jwt.claims','{\"aal\":\"aal2\"}',true);" "$scope"; then
            sed -i "/request.jwt.claim.sub','76400000-0000-4000-8000-000000000001'/a select set_config('request.jwt.claims','{\"aal\":\"aal2\"}',true);" "$scope"
          fi
          if ! grep -Fq "select set_config('request.jwt.claims','{\"aal\":\"aal2\"}',true);" "$approval"; then
            sed -i "/request.jwt.claim.sub','76500000-0000-4000-8000-000000000001'/a select set_config('request.jwt.claims','{\"aal\":\"aal2\"}',true);" "$approval"
          fi
          grep -F "request.jwt.claims" "$scope"
          grep -F "request.jwt.claims" "$approval"
      - name: Refresh exact inventory entries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const paths = [
            'staging-database/tests/staff_property_scope.sql',
            'staging-database/tests/staff_contract_approval.sql'
          ];
          const inventoryPath = 'FILE_INVENTORY.json';
          const data = JSON.parse(fs.readFileSync(inventoryPath, 'utf8'));
          for (const path of paths) {
            const entry = data.files.find((row) => row.path === path);
            if (!entry) throw new Error(`INVENTORY_ENTRY_REQUIRED:${path}`);
            const bytes = fs.readFileSync(path);
            entry.size = bytes.length;
            entry.sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            console.log(path, entry.size, entry.sha256);
          }
          fs.writeFileSync(inventoryPath, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Commit isolated MFA fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging-database/tests/staff_property_scope.sql staging-database/tests/staff_contract_approval.sql FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'test(v267): exercise isolated sensitive writes at AAL2'
          git push origin HEAD:fix/v267-jsonb-readback
