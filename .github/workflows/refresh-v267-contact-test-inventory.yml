name: Refresh V267 contact-test inventory

on:
  push:
    branches:
      - fix/v267-new-tenant-contact-preference
    paths:
      - .github/workflows/refresh-v267-contact-test-inventory.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v267-new-tenant-contact-preference
      - name: Refresh exact changed-file inventory entries
        shell: python
        run: |
          import hashlib, json, pathlib
          inventory_path = pathlib.Path('FILE_INVENTORY.json')
          data = json.loads(inventory_path.read_text(encoding='utf-8'))
          targets = ['staging-database/local-test/package.json', 'staging-database/tests/tenant_contact_preference.sql']
          entries = {entry['path']: entry for entry in data['files']}
          for target in targets:
              payload = pathlib.Path(target).read_bytes()
              entry = entries.get(target)
              if entry is None:
                  entry = {'path': target}
                  data['files'].append(entry)
                  entries[target] = entry
              entry['size'] = len(payload)
              entry['sha256'] = hashlib.sha256(payload).hexdigest()
              print(target, entry['size'], entry['sha256'])
          data['files'].sort(key=lambda entry: entry['path'])
          inventory_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit verified inventory refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_INVENTORY.json
          git diff --cached --check
          git commit -m 'chore: inventory tenant contact policy test'
          git push origin HEAD:fix/v267-new-tenant-contact-preference
