name: Isolated recovery entry
on:
  pull_request:
    branches: [main]
concurrency:
  group: aqari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Browser binaries and OS dependencies are pinned to package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check recovery.js && node --check tests/recovery.e2e.mjs
      - run: npm ci
      - name: Verify browser image matches the locked Playwright version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the Playwright container tag to match package-lock.json')"
      - name: Exercise isolated recovery with a synthetic backend
        run: node tests/recovery.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-recovery-entry
          path: test-results/recovery
          retention-days: 2
