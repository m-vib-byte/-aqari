name: Isolated recovery entry
on:
  pull_request:
    branches: [main]
concurrency:
  group: aqari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check recovery.js && node --check tests/recovery.e2e.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Exercise isolated recovery with a synthetic backend
        run: node tests/recovery.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-recovery-entry
          path: test-results/recovery
          retention-days: 2
