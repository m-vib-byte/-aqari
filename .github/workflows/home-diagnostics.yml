name: Isolated home responsiveness diagnosis
on:
  push:
    branches: [codex/home-responsiveness-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Diagnose three independent WebKit populated runs without weakening assertions
        run: node tests/v266-authenticated-home.e2e.mjs
        env:
          AQARI_HOME_DIAGNOSTICS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-home-diagnostics
          path: test-results/authenticated-home
          retention-days: 2
