name: Prepare app first paint
on:
  push:
    branches: [fix/v266-paint]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'prepare minimal inline stylesheet patch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inline only the five unchanged startup stylesheets
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const names=['first-run-migration.css','safe-autosync.css','production-status.css','final-release-ui.css','production-lockdown.css'];
          let html=fs.readFileSync('index.html','utf8');
          const original=html;
          for(const name of names){
            const link='<link rel="stylesheet" href="/'+name+'">';
            assert.equal(html.split(link).length,2);
            const css=fs.readFileSync(name,'utf8');
            assert.ok(!/@import|url\s*\(|<\/style/i.test(css));
            html=html.replace(link,'<style data-aqari-source="/'+name+'">\n'+css+'\n</style>');
          }
          const reconstructed=html.replace(/<style data-aqari-source="(\/[^\"]+\.css)">[\s\S]*?<\/style>/g,(_,href)=>'<link rel="stylesheet" href="'+href+'">');
          assert.equal(reconstructed,original,'no other HTML or auth changes are allowed');
          fs.writeFileSync('index.html',html);
          const inventory=JSON.parse(fs.readFileSync('FILE_INVENTORY.json','utf8'));
          for(const path of ['index.html','tests/app-first-paint.e2e.mjs','.github/workflows/app-first-paint.yml']){
            const b=fs.readFileSync(path),entry={path,size:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};
            const index=inventory.files.findIndex(row=>row.path===path);
            if(index<0)inventory.files.push(entry);else inventory.files[index]=entry;
          }
          fs.writeFileSync('FILE_INVENTORY.json',JSON.stringify(inventory,null,2)+'\n');
          console.log('Only five startup stylesheet links replaced with exact inline contents; authorization unchanged.');
          JS
          node --test tests/auth-data-gate.test.cjs tests/mobile-login-shell.test.cjs tests/login-navigation.test.cjs
          node scripts/release-freeze-selftest.mjs
      - name: Commit app and inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html FILE_INVENTORY.json
          git commit -m 'fix: render protected app gate without waiting for five CSS downloads'
          git push origin HEAD:fix/v266-paint
