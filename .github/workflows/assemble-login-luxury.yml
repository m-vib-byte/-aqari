name: Assemble L1 login presentation
on:
  push:
    branches: [feat/v266-luxury-login]
permissions:
  contents: write
jobs:
  assemble:
    if: "github.event.head_commit.message == 'design: assemble L1 login from unchanged authentication'"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve exact auth kernel and apply presentation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          p=Path('login.html');original=p.read_text()
          assert blob(p.read_bytes())=='23c49deac15e49cfdb8334f66210652c05a757c8','Login source changed; review required'
          scripts=re.findall(r'<script>([\s\S]*?)</script>',original)
          assert len(scripts)==1
          kernel='<script>'+scripts[0]+'</script>'
          assert hashlib.sha256(scripts[0].encode()).hexdigest()=='22c71f844b4eedd8954a938d8ffe506fc7953d8a2021b714959eb43d46e1a7ef'
          shell=Path('design/login-luxury-shell.html').read_text()
          assert shell.count('<!--AUTH_RUNTIME-->')==1
          result=shell.replace('<!--AUTH_RUNTIME-->',kernel)
          assert re.findall(r'<script>([\s\S]*?)</script>',result)==scripts
          assert len(result.encode())<30000
          p.write_text(result)
          p=Path('v199-ui.js');assert blob(p.read_bytes())=='2bfbbc59ec7f01ab103d48a1bf05b25bf535fcf9'
          s=p.read_text();old='    focusGate();\n  }\n\n  function dashboardMarkup(){'
          assert s.count(old)==1
          new='''    focusGate();
              // Non-blocking presentation enhancement. Authentication never awaits it.
              if(!document.getElementById('aqari-login-luxury-js')){
                const luxury=document.createElement('script');
                luxury.id='aqari-login-luxury-js';
                luxury.src='/login-luxury.js?design=L1';
                luxury.async=true;
                document.head.appendChild(luxury);
              }
            }
          
            function dashboardMarkup(){'''
          p.write_text(s.replace(old,new))
          p=Path('tests/mobile-login-shell.test.cjs');s=p.read_text()
          old="Buffer.byteLength(html) < 17_000, 'login plus automatic session restoration should stay under 17 KB'"
          assert old in s
          s=s.replace(old,"Buffer.byteLength(html) < 30_000, 'inline luxury layout and unchanged auth must stay under 30 KB without font or image requests'")
          p.write_text(s)
          p=Path('FILE_INVENTORY.json');inv=json.loads(p.read_text());entries={x['path']:x for x in inv['files']}
          for name in ['login.html','v199-ui.js','login-luxury.js','tests/mobile-login-shell.test.cjs','tests/luxury-login.test.cjs','tests/luxury-login.e2e.mjs','.github/workflows/luxury-login.yml']:
              data=Path(name).read_bytes();entry={'path':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              if name in entries:entries[name].update(entry)
              else:inv['files'].append(entry)
          p.write_text(json.dumps(inv,ensure_ascii=False,indent=2)+'\n')
          print('Authentication is byte-identical; presentation assembled at',len(result.encode()),'bytes.')
          PY
      - name: Require static and login contracts
        run: |
          node --check v199-ui.js
          node --check login-luxury.js
          node --test tests/luxury-login.test.cjs tests/login-navigation.test.cjs
          node tests/mobile-login-shell.test.cjs
          node scripts/release-freeze-selftest.mjs
      - name: Commit presentation without modifying workflows or any production data
        run: |
          git config user.name 'm-vib-byte'
          git config user.email 'm-vib@hotmail.com'
          git rm design/login-luxury-shell.html
          git add login.html v199-ui.js tests/mobile-login-shell.test.cjs FILE_INVENTORY.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'design: launch progressive gold and chocolate login presentation'
          git push origin HEAD:feat/v266-luxury-login
