name: Runtime contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V266 release inventory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/preview-e2e.yml'
            '.github/workflows/runtime-contracts.yml'
            'final-release-ui.js'
            'secure-auth-bridge.js'
            'v199-ui.js'
            'tests/auth-data-gate.test.cjs'
            'tests/login-navigation.test.cjs'
            'tests/v266-login-bootstrap.test.cjs'
            'tests/operational-readiness.test.cjs'
            'tests/preview.e2e.mjs'
            'tests/v202-property-os.test.cjs'
            'v202-property-os.js'
            'tests/v208-portfolio-collections.test.cjs'
            'v208-portfolio-collections.css'
            'v208-portfolio-collections.js'
            'tests/v209-behavior.test.cjs'
            'tests/v209-global-search.test.cjs'
            'tests/v209-loader.test.cjs'
            'v209-global-search.css'
            'v209-global-search.js'
            'tests/v210-daily-command-center.test.cjs'
            'v210-daily-command-center.css'
            'v210-daily-command-center.js'
            'tests/v211-follow-up-center.test.cjs'
            'tests/v211-follow-up-cloud.test.cjs'
            'tests/v211-follow-up-cloud-integration.test.cjs'
            'supabase/migrations/20260904205555_v211_1_secure_follow_up_cloud_rpc.sql'
            'v211-follow-up-cloud.js'
            'v211-follow-up-center.css'
            'v211-follow-up-center.js'
            'v211-follow-up-center-core.js'
            'v266-scheduler-control.css'
            'v266-scheduler-control.js'
            'tests/v266-scheduler-control.test.cjs'
            'supabase/migrations/20260905043259_v266_scheduler_ui_least_privilege.sql'
          )
          echo 'AQARI_V266_INVENTORY_BEGIN'
          for file in "${files[@]}"; do
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s|%s|%s\n' "$file" "$bytes" "$hash"
          done
          echo 'AQARI_V266_INVENTORY_END'
      - run: node --test tests/runtime-contracts.test.cjs tests/operational-readiness.test.cjs tests/v202-property-os.test.cjs tests/v208-portfolio-collections.test.cjs tests/auth-data-gate.test.cjs tests/login-navigation.test.cjs tests/v266-login-bootstrap.test.cjs tests/v209-behavior.test.cjs tests/v209-global-search.test.cjs tests/v209-loader.test.cjs tests/v210-daily-command-center.test.cjs tests/v211-follow-up-center.test.cjs tests/v211-follow-up-cloud.test.cjs tests/v211-follow-up-cloud-integration.test.cjs tests/v266-scheduler-control.test.cjs tests/v267-auth-repair.test.cjs
      - name: V267 workspace isolation and image processing
        run: node --test tests/v267-workspace-controls.test.cjs tests/v267-locale.test.mjs tests/payment-proof.test.mjs tests/property-statements-navigation.test.mjs tests/v267-dialog-boundary.test.mjs tests/v267-tenant-portal.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Saved receipt PDF and filtered staff access
        run: |
          python -m pip install -r requirements.txt pypdf==6.10.0
          python -m unittest discover -s tests -p rent_pdf_test.py -v
          python -m unittest discover -s tests -p property_statement_test.py -v

