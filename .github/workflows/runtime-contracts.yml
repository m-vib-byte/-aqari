name: Runtime contracts

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: aqari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V266 release inventory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/preview-e2e.yml'
            '.github/workflows/runtime-contracts.yml'
            'final-release-ui.js'
            'secure-auth-bridge.js'
            'v199-ui.js'
            'tests/auth-data-gate.test.cjs'
            'tests/login-navigation.test.cjs'
            'tests/v266-login-bootstrap.test.cjs'
            'tests/operational-readiness.test.cjs'
            'tests/preview.e2e.mjs'
            'tests/v202-property-os.test.cjs'
            'v202-property-os.js'
            'tests/v208-portfolio-collections.test.cjs'
            'v208-portfolio-collections.css'
            'v208-portfolio-collections.js'
            'tests/v209-behavior.test.cjs'
            'tests/v209-global-search.test.cjs'
            'tests/v209-loader.test.cjs'
            'v209-global-search.css'
            'v209-global-search.js'
            'tests/v210-daily-command-center.test.cjs'
            'v210-daily-command-center.css'
            'v210-daily-command-center.js'
            'tests/v211-follow-up-center.test.cjs'
            'tests/v211-follow-up-cloud.test.cjs'
            'tests/v211-follow-up-cloud-integration.test.cjs'
            'supabase/migrations/20260904205555_v211_1_secure_follow_up_cloud_rpc.sql'
            'v211-follow-up-cloud.js'
            'v211-follow-up-center.css'
            'v211-follow-up-center.js'
            'v211-follow-up-center-core.js'
            'v266-scheduler-control.css'
            'v266-scheduler-control.js'
            'tests/v266-scheduler-control.test.cjs'
            'supabase/migrations/20260905043259_v266_scheduler_ui_least_privilege.sql'
          )
          echo 'AQARI_V266_INVENTORY_BEGIN'
          for file in "${files[@]}"; do
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s|%s|%s\n' "$file" "$bytes" "$hash"
          done
          echo 'AQARI_V266_INVENTORY_END'
      - run: node --test tests/runtime-contracts.test.cjs tests/operational-readiness.test.cjs tests/v202-property-os.test.cjs tests/v208-portfolio-collections.test.cjs tests/auth-data-gate.test.cjs tests/login-navigation.test.cjs tests/v266-login-bootstrap.test.cjs tests/v209-behavior.test.cjs tests/v209-global-search.test.cjs tests/v209-loader.test.cjs tests/v210-daily-command-center.test.cjs tests/v211-follow-up-center.test.cjs tests/v211-follow-up-cloud.test.cjs tests/v211-follow-up-cloud-integration.test.cjs tests/v266-scheduler-control.test.cjs tests/v267-auth-repair.test.cjs
      - name: Session activity survives intercepted navigation and preserves idle locking
        run: node --test tests/v267-session-activity-routing.test.cjs tests/v267-session-idle-restore.test.cjs
      - name: Contract signing dialog handoff
        run: node --test tests/v267-contract-signing-navigation.test.mjs tests/v267-navigation-import.test.mjs
      - name: Document scanner upload and multipage PDF
        run: node --test tests/v267-scanner-workflow.test.mjs tests/v267-original-documents.test.mjs tests/v267-document-upload-pages.test.mjs tests/v267-contract-scanner-entry.test.cjs
      - name: V267 workspace isolation and image processing
        run: node --test tests/v267-workspace-controls.test.cjs tests/v267-locale.test.mjs tests/payment-proof.test.mjs tests/property-statements-navigation.test.mjs tests/v267-dialog-boundary.test.mjs tests/v267-tenant-portal.test.cjs tests/v267-admin-receipt-download.test.cjs tests/v267-login-locale.test.cjs tests/v267-recovery-boundary.test.cjs tests/v267-partner-session.test.mjs tests/v267-password-recovery.test.mjs tests/v267-private-files.test.mjs tests/v267-rental-records.test.cjs tests/imported-tenant-editor.test.mjs tests/v267-payroll.test.mjs
      - name: Verify complete Staging runtime against release inventory
        run: node scripts/verify-staging-runtime.mjs
      - name: Property search, presentation and verified save readback
        run: node --test tests/v267-property-presentation.test.mjs
      - name: Commercial sales and payment reconciliation readback
        run: node --test tests/v267-commercial-sales-workflow.test.mjs tests/v267-commercial-payment-allocations.test.mjs
      - name: Official document sources, immutable readback and shared PDF catalogue
        run: |
          node scripts/build-official-form-sql.mjs --check
          node --test tests/v267-official-document-source-runtime.test.mjs tests/v267-official-document-center.test.cjs tests/v267-document-catalog-completion.test.cjs tests/v267-dialog-progress.test.mjs
      - name: Historical archive filters, exports and revoked access
        run: node --test tests/v267-financial-archive.test.cjs tests/v267-financial-archive-runtime.test.mjs
      - name: Hosted acceptance SQL matches the tested source
        run: |
          node scripts/build-hosted-archive-tests.mjs --check
          node scripts/build-hosted-readiness-test.mjs --check
      - name: V267 deployment target and partial production preparation
        run: node --test tests/v267-deployment-target.test.mjs tests/v267-production-preparation.test.mjs
      - name: Contract approval at print issuance and maintenance draft recovery
        run: node --test tests/v267-contract-print.test.cjs tests/v267-service-desk.test.cjs tests/v267-maintenance-attachments.test.mjs tests/v267-maintenance-cancel-runtime.test.mjs
      - name: Staff access, expense persistence, vacating settlement and isolated PostgreSQL authorization
        run: |
          node --test tests/v267-staff-access.test.cjs tests/v267-financial-register.test.cjs tests/v267-workspace-features.test.cjs tests/v267-unit-meter-runtime.test.mjs tests/v267-unit-readiness-runtime.test.mjs tests/v267-staff-circulars-runtime.test.mjs tests/v267-service-directory.test.mjs tests/v267-lease-expiry-runtime.test.mjs tests/v267-maintenance-report-runtime.test.mjs
          node --test tests/v267-deposit*.test.mjs tests/v267-vacating*.test.mjs tests/v267-exit-review*.test.mjs tests/v267-original-documents.test.mjs
          npm ci --prefix staging-database/local-test --ignore-scripts
          npm run test:completion --prefix staging-database/local-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Saved receipt PDF and filtered staff access
        run: |
          python -m pip install -r requirements.txt pypdf==6.10.0
          python -m unittest discover -s tests -p rent_pdf_test.py -v
          python -m unittest discover -s tests -p property_statement_test.py -v
          python -m unittest discover -s tests -p official_document_pdf_test.py -v
          python -m unittest discover -s tests -p official_document_archive_test.py -v
          python -m unittest discover -s tests -p financial_archive_xlsx_test.py -v
          python -m unittest discover -s tests -p provider_webhook_test.py -v
          python -m unittest discover -s tests -p outbound_adapters_test.py -v
