name: Runtime contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release inventory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/preview-e2e.yml'
            '.github/workflows/runtime-contracts.yml'
            'final-release-ui.js'
            'tests/v207-smart-collections.test.cjs'
            'v207-smart-collections.css'
            'v207-smart-collections.js'
          )
          echo 'AQARI_RELEASE_INVENTORY_BEGIN'
          for file in "${files[@]}"; do
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s|%s|%s\n' "$file" "$bytes" "$hash"
          done
          echo 'AQARI_RELEASE_INVENTORY_END'
      - name: Build release inventory candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const inventory = JSON.parse(fs.readFileSync('FILE_INVENTORY.json','utf8'));
          const targets = [
            '.github/workflows/preview-e2e.yml',
            '.github/workflows/runtime-contracts.yml',
            'final-release-ui.js',
            'tests/v207-smart-collections.test.cjs',
            'v207-smart-collections.css',
            'v207-smart-collections.js'
          ];
          const byPath = new Map(inventory.files.map(entry => [entry.path, entry]));
          for (const file of targets) {
            const data = fs.readFileSync(file);
            const next = {
              path:file,
              size:data.length,
              sha256:crypto.createHash('sha256').update(data).digest('hex')
            };
            if (byPath.has(file)) Object.assign(byPath.get(file), next);
            else { inventory.files.push(next); byPath.set(file,next); }
          }
          const text = JSON.stringify(inventory,null,2)+'\n';
          console.log('AQARI_RELEASE_INVENTORY_B64_BEGIN');
          console.log(Buffer.from(text,'utf8').toString('base64'));
          console.log('AQARI_RELEASE_INVENTORY_B64_END');
          NODE
      - run: node --test tests/runtime-contracts.test.cjs tests/v202-property-os.test.cjs tests/v207-smart-collections.test.cjs