name: Runtime contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V209 release inventory diagnostics
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/preview-e2e.yml'
            '.github/workflows/runtime-contracts.yml'
            'final-release-ui.js'
            'secure-auth-bridge.js'
            'v199-ui.js'
            'tests/auth-data-gate.test.cjs'
            'tests/preview.e2e.mjs'
            'tests/v202-property-os.test.cjs'
            'v202-property-os.js'
            'tests/v208-portfolio-collections.test.cjs'
            'v208-portfolio-collections.css'
            'v208-portfolio-collections.js'
            'tests/v209-behavior.test.cjs'
            'tests/v209-global-search.test.cjs'
            'tests/v209-loader.test.cjs'
            'v209-global-search.css'
            'v209-global-search.js'
          )
          echo 'AQARI_V209_INVENTORY_BEGIN'
          for file in "${files[@]}"; do
            test -f "$file"
            bytes=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s|%s|%s\n' "$file" "$bytes" "$hash"
          done
          echo 'AQARI_V209_INVENTORY_END'
      - run: node --test tests/runtime-contracts.test.cjs tests/v202-property-os.test.cjs tests/v208-portfolio-collections.test.cjs tests/auth-data-gate.test.cjs tests/v209-behavior.test.cjs tests/v209-global-search.test.cjs tests/v209-loader.test.cjs
