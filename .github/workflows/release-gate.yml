name: AQARI V210 Daily Command Center Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Release self-tests
        run: |
          npm run check
          npm run check:sync
          npm run check:migration
          npm run check:autosync
          npm run check:preview-e2e
          npm run check:routes
          npm run check:final
          npm run check:production-ui
          npm run check:freeze
          node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          find api scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check public-config.js
          node --check supabase-adapter.js
          node --check cloud-sync.js
          node --check safe-autosync.js
          node --check secure-auth-bridge.js
          node --check v199-ui.js
          node --check v201-experience.js
          node --check v202-property-os.js
          node --check v205-simplified-shell.js
          node --check v209-global-search.js
          node --check v210-daily-command-center.js
          node --check lib/read-only.js
      - name: Verify release marker
        run: |
          grep -q "V198" index.html
          grep -q "V201-preview" v201-experience.js
          grep -q "V206-preview" v202-property-os.js
          grep -q "V205-preview" v205-simplified-shell.js
          grep -q "AQARI V200 luxury presentation" v200-luxury.css
          grep -q "AQARI V201 quiet-luxury experience" v201-easy.css
          grep -q "aqari-v198-secure-cloud-js" index.html
          grep -q "aqari-v199-ui-js" final-release-ui.js
          grep -q "aqari-v200-luxury-css" final-release-ui.js
          grep -q "aqari-v201-easy-css" final-release-ui.js
          grep -q "aqari-v201-experience-js" final-release-ui.js
          grep -q "aqari-v202-prestige-css" final-release-ui.js
          grep -q "aqari-v202-property-os-js" final-release-ui.js
          grep -q "aqari-v205-simple-css" final-release-ui.js
          grep -q "aqari-v205-simplified-shell-js" final-release-ui.js
          grep -q "aqari-v206-integrated-ledger-css" final-release-ui.js
          grep -q "AQARI V202" v202-prestige.css
          grep -q "AQARI V206" v206-integrated-ledger.css
          grep -q "V210-daily-command-center" v210-daily-command-center.js
          grep -q "aqari-v210-daily-command-center-js" final-release-ui.js
