name: AQARI V189 Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package check
        run: npm run check
      - name: JavaScript syntax
        run: |
          node --check api/health.js
          node --check api/release.js
          node --check api/config-status.js
          node --check api/supabase-status.js
          node --check public-config.js
          node --check supabase-adapter.js
          node --check scripts/check.mjs
          node --check scripts/smoke.mjs
          node --check scripts/verify-deployment.mjs
          node --check scripts/preflight-env.mjs
          node --check scripts/deploy-ready.mjs
      - name: Verify release marker
        run: grep -q "V189" index.html
